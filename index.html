/* ---- counting how many distinct tales the text engine can make ---- */
const _pc={};
function cntT(tpl,t){const keys={};tpl.replace(/\{\+?([a-z_]+)(\d?)\}/g,(m,n,d)=>{keys[n+d]=n});let p=1;for(const k in keys){const n=keys[k];p*=(/^(hero|item|pct|next|iname|up|rival|nem|pcomp|bans|gold|comp|lvl)$/.test(n))?1:n==="num"?98:poolN(n,t)}return p}
function poolN(n,t){const k=n+t;if(_pc[k]!=null)return _pc[k];_pc[k]=1;const a=pool(n,t);let s=0;for(const e of a)s+=cntT(e,t);return _pc[k]=s}
function tpN(name,t){let s=0;for(const x of tp(name,t))s+=cntT(x,t);return s}
function itemN(t){let s=0;const m=poolN("mat",t),f=poolN("suf",t),n=poolN("npcn",t);for(const sl of SL){const b=P["b_"+sl].length;s+=b*(m+m*f+n*m+n*m*f)}return s/SL.length}
function tales(){let tot=0;for(const t of["g","n","e"]){
  tot+=tpN("open",t)*tpN("blow",t)*(tpN("win",t)+tpN("lose",t));
  tot+=tpN("loot",t)*itemN(t)*(tpN("eq",t)+tpN("junk",t))/1;
  for(const k of["lvl","hogUp","hogDn","cal","god","npc","amb","qstep","qdone","rwin","rlose"])tot+=tpN(k,t);
  tot+=poolN("qverb",t)*poolN("qobj",t)*poolN("npcn",t)*5*tpN("qstep",t)*4;
  tot+=15*15*tpN("rwin",t);
  for(const e of SCN[t].concat(SCN.a))tot+=cntT(e[0],t);
  tot+=tpN("cbant",t)*COMPK.length+tpN("cdep",t)*COMPK.length;
  for(const d of DIL)tot+=cntT(d.s,t)*(cntT(d.g,"g")+cntT(d.n,"n")+cntT(d.e,"e"))/3;
}return Math.round(tot)+(typeof chronN==="function"?chronN():0)+(typeof sagaN==="function"?sagaN():0)+(typeof storyN==="function"?storyN():0)}

/* ================= OFFLINE CATCH-UP ================= */
function pickHL(arr){
  let c=arr.filter(e=>e[5]>0);
  const lv=c.filter(e=>e[0]==="level"),lastLv=lv[lv.length-1];
  c=c.filter(e=>e[0]!=="level"||e[6]%5===0||e===lastLv);
  const top=c.filter(e=>e[5]===2),low=c.filter(e=>e[5]===1);
  let keep=top.slice(-10);const room=16-keep.length;
  if(room>0&&low.length){const st=Math.max(1,Math.ceil(low.length/room));for(let i=low.length-1;i>=0&&keep.length<16;i-=st)keep.push(low[i])}
  return keep.sort((a,b)=>a[4]-b[4]);
}
function catchUp(real){
  real=Math.min(real,172800);if(real<20)return null;
  const game=real*S.speed;
  const pre={l:S.lvl,w:S.wins,ls:S.losses,q:S.quests,e:S.evs,g:S.gold,b:S.bans,cp:S.comps.length,d:S.dist,st:S.stage};
  const t0=Date.now()-real*1000;
  QUIET=true;BUF=[];
  const steps=Math.min(Math.floor(game/EV),1800);
  if(steps<1){gain(game);dilTick(game);offRun(real);autoTick(true)}
  else{const per=game/steps;for(let i=0;i<steps;i++){CLK=t0+(i+1)/steps*real*1000;gain(per);dilTick(per);offRun(real/steps);for(let k=0;k<3;k++)autoTick(true);fire()}}
  CLK=0;QUIET=false;
  if(typeof arcStep==="function"){const n=Math.min(8,Math.floor(real/1200));for(let i=0;i<n;i++){if(S.arc)S.arc.w=0;if(S.arcCd>0)S.arcCd=0;arcStep(tone())}}
  const hl=pickHL(BUF);BUF=[];notable=[];
  let first=null;
  if(S.evs-pre.e>0||S.lvl>pre.l){
    const dg=S.gold-pre.g;
    CLK=t0;first=say("sys","While you were away <i class=\"d\">("+fmt(real)+")</i>, "+sn()+" kept living: "+(S.evs-pre.e)+" happenings, +"+(S.lvl-pre.l)+" levels, "+(S.wins-pre.w)+" wins, "+(S.losses-pre.ls)+" losses, "+(dg>=0?"+":"−")+fmtG(Math.abs(dg))+"¢, jogged "+Math.round(S.dist-pre.d)+" m ("+(S.stage-pre.st)+" new stages), banned from "+(S.bans-pre.b)+" more places. Highlights:");CLK=0;
    for(const e of hl){S.feed.push(e);addLine(e[0],e[1],e[2],e[3],e[4])}
  }
  evT=EV*(.6+.8*R());
  return first;
}

"A sandstorm kicks up in Cactus Flats. {hero} hides behind a rock. The rock says 'excuse me'. {hero} says 'sorry'. The rock says 'you're sitting on my husband'. {hero} says 'I'll move'. The rock says 'no, you're fine'.",
"{hero} finds a skeleton in the desert holding a map. The map says 'X marks the spot'. {hero} looks around. There's no X. There's just the skeleton and a very smug lizard.",
"The Sunburnt Lizard tells {hero} that the secret to surviving the desert is 'not to be there'. {hero} says 'that's not helpful'. The lizard says 'I know, but I'm very comfortable'.",
"{hero} sees a cactus that looks exactly like {nem}. {comp} says 'that's a coincidence'. {hero} says 'it's got the same eyes'. The cactus says 'I'm a plant'. {hero} says 'so is {nem}, apparently'.",
"A tumbleweed rolls past {hero}, then rolls back, then rolls past again. {comp} says 'what's it doing?' {hero} says 'I think it's lost'. The tumbleweed says 'I'M NOT LOST. I'M EXPLORING'. It's lost.",
"{hero} stumbles upon a very elaborate sandcastle in the desert. A sign reads: 'DO NOT TOUCH. WE'VE BEEN HERE A WHILE'. A tiny sand king waves from the tower. {hero} waves back, very gently.",
"{hero} buys a hat from a cactus farmer. It's wide-brimmed, comfortable, and slightly prickly. 'It's a feature', says the farmer. {hero} asks which feature. The farmer says 'the one that stops you wearing it'.",
"At noon, everything in Cactus Flats stops. The animals, the wind, even {hero}'s inner monologue. {comp} says 'it's the heat'. {hero} says 'it's the silence'. A cactus says 'it's the siesta'.",
"The Mirage Salesman shows {hero} a brochure. 'Luxury lakeside living, only forty miles from here, and always forty miles from here'. {hero} says 'that's not an offer'. The salesman says 'it's a lifestyle'.",
"{hero} and {comp} pass a skeleton in a cowboy hat. {comp} says 'it's sad'. {hero} says 'it's the desert'. The skeleton says 'it's a lot worse than sad'. They keep walking, quickly.",
"{hero} meets a talking camel who says the desert is a state of mind. 'Which state?' {hero} asks. The camel says 'dehydration'. {hero} says 'that's not a state of mind'. The camel says 'it will be'.",
"An old man sits in front of a rock, waiting. {hero} asks what he's waiting for. 'For the rock to say something', he says. {hero} asks how long. 'Forty years', he says. The rock says 'hello'. The old man says 'finally'.",
"{hero} finds a pool of water in the desert. It's perfect, cool, and clear. {hero} dives in. It's a very shallow pool, and now {hero} is mostly mud, and {comp} is very quiet about it.",
"A water seller in Cactus Flats says 'Water! Fresh water! Only five gold a cup!' {hero} says 'that's expensive'. The seller says 'you're in a desert'. {hero} says 'it's still a rip-off'. The seller says 'it's a rip-off in a desert'."
]});

lines:[
"A Snowman Union Rep approaches {hero} with a clipboard. 'We're asking for better hats, longer winters, and a stricter policy on carrot theft'. {hero} says 'that's reasonable'. The rep says 'it's a start'.",
"A Penguin Mafia member waddles up to {hero} and says 'nice snow you got here. It'd be a shame if something happened to it'. {hero} says 'it's not my snow'. The penguin says 'it's your problem now'.",
"An Icicle Gremlin drops from the ceiling onto {hero}'s head and then immediately apologizes. 'I'm so sorry, it's just that I'm on a schedule'. {hero} says 'it's fine'. It's not. It stings.",
"{hero} sees a snowman in the distance. {comp} says 'it's a snowman'. {hero} says 'it's waving'. {comp} says 'it's a friendly snowman'. The snowman says 'I'M NOT FRIENDLY. I'M ORGANIZING'.",
"{hero} sits down to rest on an ice bench. The bench says 'excuse me, this is my spot'. {hero} says 'it's a bench'. The bench says 'it's a very cold bench, and I'm very territorial'.",
"{hero} makes a snow angel. It stands up and says 'thank you'. {hero} says 'you're welcome'. The snow angel says 'I'm leaving now'. {hero} says 'where to?' The snow angel says 'somewhere warmer'.",
"A polar bear in a scarf approaches {hero}. 'Cold, isn't it?' it says. {hero} says 'yes'. The bear says 'I find it relaxing'. {hero} says 'you're a polar bear'. The bear says 'I'm on vacation'.",
"{hero} spots a sled with nobody in it, rushing down a hill. {comp} says 'where's the driver?' {hero} says 'it's a very independent sled'. The sled says 'WHEEE', and crashes into a very large snowman.",
"{hero} buys hot cocoa from a stand run by a yeti. 'Marshmallows?' the yeti asks. {hero} says 'yes please'. The yeti says 'that's extra'. {hero} says 'how much?' The yeti says 'your dignity'.",
"{hero} tries to cross a frozen pond. {comp} says 'the ice looks thin'. {hero} says 'it'll hold'. The ice says 'it won't'. {hero} says 'I'll be quick'. The ice says 'that's not how it works'.",
"A penguin in a tuxedo offers {hero} a fish. 'It's fresh', he says. {hero} says 'it's frozen'. The penguin says 'it's very fresh, in its way'. {hero} says 'I'll pass'. The penguin says 'you're making a mistake'. It's a fish.",
"{hero} is invited to a blizzard party in Frostbite Flats. The theme is 'being cold'. {hero} says 'that's not a theme'. The host says 'it's a lifestyle'. {hero} goes anyway. It's very cold, and it's a lot of fun.",
"The Frostbite Flats have a unique form of currency: ice cubes. They melt, which means the economy is in constant flux. {hero} asks how anyone saves. The banker says 'they don't, they just keep refrigerating'.",
"{hero} finds an igloo with a sign: 'HOME SWEET HOME'. Inside, a yeti sits on a couch, watching a tiny, flickering fire. 'Come in', he says. {hero} says 'it's very cozy'. The yeti says 'it's very small'.",
"A very small snowman asks {hero} for directions to the sun. {hero} says 'you don't want to go there'. The snowman says 'I want to see it'. {hero} says 'it'll be the last thing you see'. The snowman says 'worth it'.",
"{hero} learns that the Icicle Gremlin lives on the underside of a bridge and has been charging a toll in the form of 'a very small yelp'. {hero} yelps. The gremlin says 'close enough'.",
"A sled dog in Frostbite Flats tells {hero} 'I've had enough of being a dog'. {hero} asks what it'd like to be. 'A sled', the dog says. {hero} says 'that's not an upgrade'. The dog says 'it's less work'.",
"{hero} stumbles on a clearing with a perfect ring of frozen snowmen. A sign reads 'HOLIDAY SPIRIT (DO NOT MELT)'. {hero} wonders what happens if he does. {comp} says 'don't find out'. {hero} blows on one. Nothing happens. It's fine.",
"A fisherman sits at a hole in the ice. {hero} asks what he's fishing for. 'Peace and quiet', he says. {hero} asks if it's biting. 'Not yet', he says, 'but I've got a lot of patience, and a very good hook'.",
"{hero} meets a snow queen who says 'I'm the ruler of all the ice in these lands'. {hero} says 'that's a lot of ice'. The queen says 'it's a lot of work'. {hero} says 'do you have a staff?' The queen says 'I have a slush'.",
"{hero} walks into a snowdrift and gets stuck. {comp} says 'we have to get you out'. {hero} says 'I'm fine'. A penguin says 'you're not fine, you're a very large ornament'. {hero} says 'I'm a hero'. The penguin says 'it's a good ornament'.",
"{hero} finds a snowman with a sign that reads 'FREE HUGS'. {hero} hugs it. It melts a little. {hero} says 'I'm sorry'. The snowman says 'it was worth it'. {hero} says 'was it?' The snowman says 'no'.",
"{hero} and {comp} get lost in a blizzard. After an hour, they find a cabin with a light. They knock. A very tired man opens the door and says 'oh good, you're here'. {hero} says 'you were expecting us?' The man says 'I'm expecting everyone, it's a blizzard'.",
"{hero} trips on a patch of ice and slides all the way down a hill, through a village, past a very confused snowman, and out the other side. 'Nice run', says a penguin. {hero} says 'thanks'. It's the best hill {hero} has ever fallen down.",
"The Penguin Mafia sets up a protection racket for the local snowmen. The snowmen say 'protection from what?' The penguins say 'from us'. The snowmen say 'that's not protection'. The penguins say 'it's the only kind we offer'.",
"A lone snowflake falls on {hero}'s nose. {hero} says 'it's beautiful'. The snowflake says 'I'm not, I'm a snowflake, I'm a hundred of me, and I'm so tired'. {hero} says 'sorry'. The snowflake says 'it's the cold'."
]});

lines:[
"A Sporeling Bouncer stops {hero} at the edge of a toadstool grove. 'You're not on the list', he says. {hero} says 'what list?' The bouncer says 'the list of people who are on the list'. {hero} says 'is that a long list?' The bouncer says 'it's just me'.",
"A Gloomy Toadstool stares at {hero} and sighs. 'You'll be moving on soon', it says. {hero} says 'I'll be moving on soon'. The toadstool says 'everyone does'. {hero} says 'I'll visit'. The toadstool says 'you won't'. It's right.",
"A Hallucination (Probably) offers {hero} a sandwich. {hero} says 'is it real?' The hallucination says 'what does 'real' mean?' {hero} says 'it means I can eat it'. The hallucination says 'then yes'. It's a delicious sandwich.",
"{hero} walks into a cloud of spores. Suddenly, everything is a little more colorful. {comp} says 'are you alright?' {hero} says 'I can see sounds'. {comp} says 'that's concerning'. {hero} says 'they're beautiful'.",
"{hero} meets a mushroom with a monocle. 'Good day', it says. {hero} says 'good day'. The mushroom says 'I'm a fungi of distinction'. {hero} says 'what's the distinction?' The mushroom says 'I'm not poisonous. Mostly'.",
"A mushroom farmer in Mushroom Meh-dows tells {hero} that the secret to a good crop is 'patience, darkness, and not asking too many questions'. {hero} says 'that's three secrets'. The farmer says 'it's a three-secret crop'.",
"{hero} stumbles across a field of toadstools that are all bouncing. {comp} says 'why?' {hero} says 'they're bouncy'. {comp} says 'that's not an answer'. A toadstool says 'it's the only answer'.",
"A snail in a monocle blocks the road. 'It's a toll road', it says. {hero} says 'how much?' The snail says 'about three hours of your time'. {hero} says 'I don't have that'. The snail says 'you will, by the time you get past me'.",
"{hero} eats a bright blue mushroom and starts to see the world in a different light. {comp} asks how it feels. {hero} says 'it feels like everything is fine'. {comp} says 'that's what worries me'.",
"A talking puffball rolls up to {hero} and says 'hug me'. {hero} hugs it. A huge cloud of spores erupts. {hero} says 'that's not a hug'. The puffball says 'it's a very enthusiastic one'.",
"{hero} meets a mycologist who has been studying a single mushroom for twenty years. 'It's fascinating', he says. {hero} asks what he's learned. The mycologist says 'that it's a mushroom'.",
"The Gloomy Toadstool whispers to {hero}: 'Nobody ever stays'. {hero} says 'I'm staying for lunch'. The toadstool says 'that's not staying'. {hero} says 'it's a start'. The toadstool smiles, in a gloomy way.",
"{hero} finds a ring of mushrooms and steps in. Nothing happens. {hero} steps out. Everything is the same. {comp} says 'it was a trap'. {hero} says 'it was a very mild trap'.",
"A mushroom gives {hero} a pamphlet titled 'YOU ARE NOT SEEING THINGS (YOU ARE, BUT IT'S FINE)'. {hero} reads it. It's helpful. It's also upside down, and {hero} isn't sure when that happened.",
"{hero} sees a toadstool with a tiny hat. {comp} says 'it's cute'. {hero} says 'it's staring at me'. {comp} says 'it's a toadstool'. {hero} says 'it knows my name'. The toadstool says '{hero}'. {hero} says 'oh no'.",
"A Sporeling Bouncer waves {hero} through a velvet rope into a toadstool club. Inside, a dozen mushrooms are dancing very slowly to a song that nobody can hear. {hero} joins in. It's the best night of {hero}'s life, and nobody remembers it.",
"{hero} tries to leave Mushroom Meh-dows but keeps ending up in the same spot. {comp} says 'we're going in circles'. {hero} says 'it's a very nice circle'. A mushroom says 'it's not a circle, it's a ring'. They give up and stay.",
"A mushroom forager in Mushroom Meh-dows offers {hero} a basket of caps. 'Pick one', he says. {hero} picks one. The forager says 'that's the wrong one'. {hero} puts it back. The forager says 'that's also the wrong one'. All of them are wrong.",
"{hero} wakes up in a ring of mushrooms with no memory of how he got there. {comp} says 'you wandered off, danced for three hours, and then fell asleep on a toadstool'. {hero} says 'that sounds nice'. {comp} says 'it was awful'.",
"A very polite fungus asks {hero} if it might sit on his hat. {hero} says 'sure'. The fungus sits. A moment later, there are a dozen of them. {hero} says 'that's a lot of fungus'. The fungus says 'we're very close'.",
"{hero} finds a mushroom that looks like a tiny house. A tiny chimney. A tiny door. A tiny sign: 'NOT A HOUSE'. {hero} knocks. A tiny voice says 'go away'. {hero} goes away, confused and a little moved.",
"A spore cloud drifts across the path. {comp} says 'hold your breath'. {hero} holds it. {comp} says 'you can let go'. {hero} says 'I can't, I'm holding a lot of feelings'. {comp} says 'that's the spores'.",
"{hero} passes a mushroom with a sign: 'FREE ADVICE'. {hero} says 'what's the advice?' The mushroom says 'don't eat me'. {hero} says 'I wasn't going to'. The mushroom says 'good advice, then'.",
"A bouncing mushroom boings {hero} into the air, past a cloud, and back down. 'Do it again?' it says. {hero} says 'I'd love to, but I also love my spine'. The mushroom says 'it's very bouncy'. {hero} says 'that's what I'm afraid of'.",
"A toadstool tells {hero} a joke. It's long, with a lot of setup, and a very bad punchline. {hero} laughs. The toadstool says 'you didn't get it'. {hero} says 'I laughed'. The toadstool says 'it was a polite laugh'.",
"A moss-covered log in Mushroom Meh-dows says 'I used to be a tree'. {hero} says 'what happened?' The log says 'life'. {hero} says 'that's all?' The log says 'and a lot of mushrooms'.",
"{hero} sits down on a large toadstool. It says 'I'm not a chair'. {hero} says 'sorry'. The toadstool says 'it's alright, everyone does it'. {hero} stands up. The toadstool says 'no, stay, it's nice'.",
"A wizard covered in spores approaches {hero} and says 'I speak in colors'. {hero} says 'what color am I?' The wizard says 'beige'. {hero} says 'that's rude'. The wizard says 'it's a very emotional beige'.",
"{hero} finds a perfect circle of mushrooms with a sign: 'THIS IS THE CENTER OF MUSHROOM MEH-DOWS'. {hero} says 'it doesn't look central'. The mushroom says 'it's emotionally central'."
]});

lines:[
"A Sentient Gumdrop looks up at {hero} and says 'please, no'. {hero} says 'I wasn't going to'. The gumdrop says 'everyone says that'. {hero} says 'I really wasn't'. The gumdrop says 'you looked at me like you were thinking about it'. {hero} was.",
"A Dentist Golem looms over {hero}. 'Open wide', it says. {hero} says 'I'm fine'. The golem says 'that's what they all say'. {hero} says 'I'm just here for the scenery'. The golem says 'the scenery is a dental problem'.",
"A Licorice Viper hisses at {hero}. 'I'm very dangerous', it says. {hero} says 'you're a snack'. The viper says 'I'm a snack that bites'. {hero} takes a bite. The viper says 'that's not how it works'. {hero} says 'it's licorice'.",
"{hero} walks through Candy Cavity. Everything is delicious. {comp} says 'don't eat anything'. {hero} says 'it's all edible'. {comp} says 'it's all trapped'. {hero} says 'but it's so tasty'. {comp} says 'that's the trap'.",
"A candy cane guard stands at attention at the entrance to a gingerbread village. 'Halt', he says. {hero} halts. The guard says 'you may proceed'. {hero} proceeds. The guard says 'halt'. This goes on for some time.",
"{hero} bites into a gumdrop. It screams. {hero} says 'sorry'. The gumdrop says 'I accept your apology, and your lunch'. {hero} says 'I'm not hungry anymore'. The gumdrop says 'good'.",
"{hero} finds a gingerbread house with a sign: 'WITCH-FREE ZONE'. A witch emerges and says 'it's not a lie, I'm a baker'. {hero} says 'is there a difference?' The witch says 'I use less oven'.",
"A chocolate fountain in Candy Cavity speaks to {hero}: 'I'm so tired of being delicious'. {hero} says 'that's a good problem to have'. The fountain says 'it's a very warm problem'. {hero} says 'I'm sorry'. The fountain says 'it's fine, I'm melted anyway'.",
"{hero} meets a lollipop lady who stops traffic with a giant lolly. 'It's very effective', she says. {hero} says 'there's no traffic'. She says 'that's because of the lolly'.",
"A giant gumdrop bounces toward {hero}, shouting 'I'M NOT A GUMDROP'. {hero} says 'what are you?' The gumdrop says 'I'M A BOUNCY CASTLE'. {hero} says 'you look like a gumdrop'. The gumdrop says 'I'M GOING THROUGH SOMETHING'.",
"{hero} sees a candy cane forest. Each cane is a different color, and each one is whispering. {comp} says 'it's beautiful'. {hero} says 'it's creepy'. A cane says 'it's both'.",
"A baker in Candy Cavity offers {hero} a free cupcake. {hero} says 'what's the catch?' The baker says 'no catch'. {hero} bites. The baker says 'there's a small catch'. {hero} says 'what?' The baker says 'it's a very large cupcake'.",
"{hero} steps in a pool of caramel. It's warm, sticky, and surprisingly deep. {comp} says 'I'll get a rope'. {hero} says 'don't leave me'. {comp} says 'I'll be right back'. {hero} says 'that's what they say, and then they leave'.",
"A jawbreaker rolls past {hero}, picking up speed. {comp} says 'jump'. {hero} says 'why?' {comp} says 'it's a jawbreaker'. {hero} jumps. The jawbreaker rolls past. {hero} says 'that was easy'. {comp} says 'it's the second one that's the problem'.",
"The Dentist Golem asks {hero} 'when was your last check-up?' {hero} says 'I'm a hero'. The golem says 'that's not an answer'. {hero} says 'it's a lifestyle'. The golem says 'it's a very bad one'.",
"{hero} passes a taffy pit full of stuck adventurers. One waves. {hero} says 'need help?' The adventurer says 'no, I'm fine, I'm just thinking'. {hero} says 'for how long?' The adventurer says 'a few months'.",
"A gingerbread man runs past {hero}, screaming 'DON'T LET THEM CATCH ME'. {hero} says 'who?' A very hungry child runs past, screaming 'GIVE ME THE COOKIE'. {hero} says 'I'm not involved'.",
"{hero} trades with a candy merchant who sells everything at a 'premium sweet price'. {hero} says 'what's a sweet price?' The merchant says 'it's a fair price, but with sugar'. {hero} says 'that's more expensive'. The merchant says 'it's a lot more fun'.",
"{hero} meets a sad gumdrop. It says 'I wish I were a lollipop'. {hero} says 'why?' The gumdrop says 'they've got sticks'. {hero} says 'that's not a good reason'. The gumdrop says 'it's the best I've got'.",
"A candy cane tells {hero} 'I'm not a cane, I'm a staff'. {hero} says 'you're a cane'. The cane says 'I'm a staff of sugar'. {hero} says 'that's still a cane'. The cane says 'you're no fun'.",

"{hero} sees a chocolate river, a gumdrop bridge, and a signpost: 'DO NOT FALL IN'. {hero} falls in. It's glorious. {comp} says 'we told you'. {hero} says 'I'm having a wonderful time'. {comp} says 'that's the problem'.",
"The Sprinkle Summit is the tallest peak in Candy Cavity, and it's covered in a thick layer of confection. {hero} climbs it. At the top, a sign says 'BE CAREFUL WHAT YOU WISH FOR'. {hero} wishes for a hot bath. It's chocolate.",
"A frosted cupcake approaches {hero} and says 'I'm not a cupcake'. {hero} says 'what are you?' The cupcake says 'I'm an idea'. {hero} says 'you're a cupcake'. The cupcake says 'it's a very delicious idea'.",
"{hero} passes a sweet shop that's gone bankrupt. A sign reads 'CLOSED: TOO MUCH SUGAR'. Inside, a gumdrop is crying. {hero} says 'can I help?' The gumdrop says 'could you buy something?' {hero} buys a gumdrop. The gumdrop is horrified.",
"A licorice viper curls up on a rock beside {hero}. 'I'm so misunderstood', it says. {hero} says 'you're licorice'. The viper says 'it's a metaphor'. {hero} says 'it's a snack'. The viper says 'it's a metaphorical snack'.",
"{hero} sits down for a break and eats a gingerbread cookie. It says 'I'm so sorry'. {hero} says 'for what?' The cookie says 'for what I'm about to do'. {hero} says 'what are you going to do?' The cookie says 'taste amazing'.",
"The cotton candy clouds above Candy Cavity are dissolving. {comp} says 'it's rain'. {hero} says 'it's sticky rain'. {comp} says 'it's the worst kind'. {hero} says 'it's also the best kind'. They stand in the rain and eat it.",
"{hero} meets a gummy bear who claims to be the king of Candy Cavity. 'Bow before me', he says. {hero} bows. 'You're not a bear', the king says. {hero} says 'neither are you'. The king says 'I'm a very large gummy bear'."

lines:[
"A Geode Goblin pops out of a crack in the wall and says 'I've got shiny things!' {hero} says 'what kind?' The goblin says 'all the kinds'. {hero} says 'can I see?' The goblin says 'no, I just wanted you to know'.",
"An Echo Bat swoops past {hero} and says 'EEEEK'. {hero} says 'EEEEK'. The bat says 'STOP COPYING ME'. {hero} says 'STOP COPYING ME'. This goes on for a while and is more satisfying than it should be.",
"A Stalagmite Preacher addresses a small crowd of pebbles. 'And lo, the rock shall be a rock, and the stone shall be a stone'. {hero} says 'that's not much of a sermon'. The preacher says 'it's a very short revelation'.",
"{hero} walks into a chamber full of crystals. They all glow, just a little. {comp} says 'it's beautiful'. {hero} says 'it's blinding'. A crystal says 'it's a lot of pressure'.",
"{hero} hears a dripping sound in the Crystal Caverns. It's constant, patient, and very annoying. {comp} says 'it's just water'. {hero} says 'it's a very rude water'.",
"{hero} meets a miner who's been digging for a gem for years. 'I almost found it', he says. {hero} asks how close. The miner says 'about three feet'. {hero} says 'that's close'. The miner says 'it's been three feet for a decade'.",
"A crystal healer in the Crystal Caverns waves a rock over {hero}. 'Your aura is slightly off', she says. {hero} says 'is that bad?' She says 'it's a very pretty off'. {hero} says 'I'll take it'.",
"The Crystal Caverns echo with a strange song. {hero} follows it until he finds a crystal singing to itself. It says 'oh, I didn't see you there'. {hero} says 'don't stop'. The crystal says 'it's a private song'.",
"{hero} steps on a loose rock, which triggers a very small avalanche of pebbles. They roll down a hill, bounce off a wall, and land in a hole. A voice says 'hey'. {hero} says 'sorry'. The voice says 'I was napping'.",
"A cave troll runs a tea shop in the Crystal Caverns. 'Welcome', he says. {hero} says 'what's on the menu?' The troll says 'tea'. {hero} says 'that's all?' The troll says 'it's a very good tea, and a very large troll'.",
"{hero} finds a crystal that reflects not his face, but his future. {hero} says 'what's it show?' {comp} says 'nothing'. {hero} says 'it's a blank'. {comp} says 'it's a very optimistic blank'.",
"A group of dwarves in the Crystal Caverns argue over who found a gem first. They're all very small, and very loud, and one of them is a gnome in a hat. {hero} says 'can I help?' All of them say 'no'. They shake hands, and then fight.",
"The Echo Bat tells {hero} 'I'm not afraid of anything'. {hero} says 'what about the dark?' The bat says 'I live in it'. {hero} says 'what about light?' The bat says 'I'm not a fan'. It's a bat with boundaries.",
"{hero} notices a large amethyst in the wall. {comp} says 'we should take it'. {hero} says 'it's a part of the cave'. {comp} says 'it's a gem'. The amethyst says 'it's a very long relationship'.",
"{hero} finds a stalagmite that looks remarkably like a person. It's holding a tiny sign: 'HELP, I'M A ROCK'. {hero} says 'are you a rock?' The stalagmite says 'it's a long story'. {hero} says 'I've got time'. The stalagmite says 'I don't'.",
"A cave-in blocks the path. {hero} says 'I could go around'. {comp} says 'there's no around'. {hero} says 'then I'll go through'. The rocks say 'no'. {hero} says 'I'll ask nicely'. The rocks say 'that's different'.",
"An old dwarf sits in a corner of the cave, polishing a gem. 'It's my life's work', he says. {hero} says 'it's very shiny'. The dwarf says 'it's a rock'. {hero} says 'it's a very shiny rock'. The dwarf says 'it took forty years'.",
"{hero} drops a coin down a hole. It falls forever. {comp} says 'it's a deep hole'. {hero} says 'it's a very patient coin'. A voice from below says 'thanks'. {hero} says 'you're welcome'.",
"A geode splits open as {hero} walks by. Inside, a tiny, sparkling creature says 'oh no, I wasn't ready'. {hero} says 'I'm sorry'. The creature says 'it's fine, I'll go back to being a rock'. {hero} says 'you can stay'. The creature says 'it's too bright'.",
"{hero} finds a glowing mushroom in a corner. It illuminates a small, secret garden of crystals. {comp} says 'it's hidden'. {hero} says 'it was hidden'. {comp} says 'we've ruined it'. {hero} says 'we've enjoyed it'.",
"{hero} stares into a crystal pool and sees a reflection. It's not his. It says 'you're in my pool'. {hero} says 'it's a pool'. The reflection says 'it's a very personal one'.",
"A very polite stalactite apologizes for hanging over {hero}. 'I'm very sorry', it says. 'I've been here for thousands of years. I'm just doing what I do'. {hero} says 'it's fine'. The stalactite says 'it won't be, if I fall'.",
"{hero} finds an ancient mine cart and rides it down a track. It's thrilling for ten seconds, terrifying for twenty, and then abruptly ends at a wall. {comp} says 'that was reckless'. {hero} says 'it was a good ride'.",
"{hero} meets a ghost miner who says 'I've been digging for diamonds for years'. {hero} asks 'did you find any?' The ghost says 'no, but I found this nice wall'. {hero} says 'it's a very nice wall'.",
"A gnome in the Crystal Caverns runs a small shop that sells only rocks. 'These ones are good', he says. {hero} says 'they're rocks'. The gnome says 'they're rocks of distinction'. {hero} buys one. It's a rock.",
"The cave echoes back every word {hero} says, just a little different. {hero} says 'I'm tired'. The cave says 'I'm retired'. {hero} says 'I'm lost'. The cave says 'I'm cost'. {hero} says 'I'm done'. The cave says 'I'm fun'.",
"{hero} sees a gem the size of a house, embedded in the wall. {comp} says 'we should take it'. {hero} says 'we can't carry it'. {comp} says 'we could chip a piece'. The gem says 'please don't'.",
"{hero} finds a chamber where the crystals form a circle. In the center, a single, very small crystal sits on a pedestal. A plaque says 'THE LAST CRYSTAL'. {hero} says 'it's the last?' The crystal says 'there are plenty more, I just like the attention'.",
"A Stalagmite Preacher tells {hero} 'the cave is a metaphor'. {hero} says 'for what?' The preacher says 'for the cave'. {hero} says 'that's not a metaphor'. The preacher says 'it's a very literal metaphor'."
]});

lines:[
"A Skeleton Intern waves at {hero} and says 'I'm new here!' {hero} says 'how long have you been dead?' The skeleton says 'forty years, but I'm new to this'. {hero} says 'what's your job?' The skeleton says 'rattling, mostly'.",
"A Fussy Ghoul looks at {hero} and sighs. 'You're tracking in dirt', it says. {hero} says 'it's a graveyard'. The ghoul says 'it's a clean graveyard'. {hero} says 'there are skeletons everywhere'. The ghoul says 'they're tidy skeletons'.",
"A retired Grave Robber leans on a tombstone. 'I used to be somebody', he says. {hero} says 'what were you?' The robber says 'a very good thief'. {hero} says 'what happened?' The robber says 'I got caught by a very good ghost'.",
"{hero} walks through the Bone Orchard and notices that the skulls on the trees are wearing tiny crowns. {comp} says 'why?' {hero} says 'it's the harvest festival'. A skull says 'I'M THE KING'.",
"A ghost drifts through {hero}, and then, a moment later, drifts back and apologizes. 'I'm so sorry', it says. 'I'm still learning to be dead'. {hero} says 'how long has it been?' The ghost says 'a few centuries'.",
"{hero} finds a gravestone that reads 'HERE LIES A VERY SATISFIED CUSTOMER'. {comp} says 'what does that mean?' {hero} says 'I think it's a warning'. {comp} says 'it's a very long warning'.",
"A skeleton at a desk, filling out paperwork, glances at {hero}. 'I'll be with you in a moment', he says. {hero} says 'how long?' The skeleton says 'eternity, give or take'. {hero} says 'I'll wait'.",
"A tombstone grumbles at {hero}. 'Mind your step', it says. {hero} says 'sorry'. The tombstone says 'you've got a lot of nerve, walking on the dead'. {hero} says 'I'm a hero'. The tombstone says 'that's no excuse'.",
"{hero} meets a mortician who says 'we're all going to die'. {hero} says 'that's grim'. The mortician says 'it's just good business'. {hero} says 'you're very cheerful about it'. The mortician says 'it's very reliable work'.",
"A ghoul invites {hero} to dinner. 'It's a lovely stew', he says. {hero} asks 'what's in it?' The ghoul says 'let's not get into that'. {hero} says 'I'm not hungry'. The ghoul says 'you're a very poor guest'.",
"{hero} passes a bone merchant selling skulls, ribs, and a surprisingly good selection of femurs. 'Everything must go', he says. {hero} says 'it's a very dead business'. The merchant says 'it's got a very long shelf life'.",
"A skeleton in a bow tie says 'I'm a gentleman of the grave'. {hero} says 'you look it'. The skeleton says 'thank you'. {hero} says 'I meant the bones'. The skeleton says 'that's what I meant'.",
"{hero} stumbles on a graveyard party. Skeletons dance, ghouls drink, and a lich runs the music. {hero} says 'this is great'. A ghost says 'it's a wake'. {hero} says 'it's a very lively one'.",
"{hero} finds an unmarked grave with a tiny sign: 'PLEASE DON'T'. {hero} doesn't. {comp} says 'that was odd'. {hero} says 'it was polite'. A voice from below says 'thank you'.",
"A lich in a bathrobe peeks out of a mausoleum. 'Could you keep it down?' he says. 'I'm trying to be immortal in peace'. {hero} says 'sorry'. The lich says 'it's fine, I'll be here forever'.",
"{hero} meets a skeleton who's lost a rib. 'Have you seen it?' the skeleton asks. {hero} says 'no'. The skeleton says 'it was right here'. {hero} says 'it's a very personal loss'. The skeleton says 'it's a very important rib'.",
"The Bone Orchard's trees bear a strange fruit: tiny, round, and white. {hero} picks one. It's a tooth. {comp} says 'that's disgusting'. {hero} says 'it's a very small tooth'. The tree says 'it's mine'.",
"{hero} sees a ghost sitting on a bench, staring at the horizon. {hero} says 'are you alright?' The ghost says 'I'm just thinking'. {hero} says 'about what?' The ghost says 'about how I should've gone to the dentist'.",
"A mournful skeleton plays a violin. It's very sad, very beautiful, and slightly out of tune. {hero} says 'that's lovely'. The skeleton says 'it's the only song I know'. {hero} says 'it's a good one'. The skeleton says 'it's all I've got'.",
"{hero} wanders into a crypt and finds a skeleton at a tiny desk. 'Reception', it says. {hero} says 'for what?' The skeleton says 'for the dead, mostly, but anyone may apply'. {hero} says 'I'm alive'. The skeleton says 'that's a shame'.",
"A Fussy Ghoul rearranges a pile of bones. 'It's all about presentation', he says. {hero} says 'they're bones'. The ghoul says 'they're a very well-presented pile'. {hero} says 'it's a fine pile'.",
"A grave robber asks {hero} to keep a secret. {hero} says 'what is it?' The robber says 'I'm afraid of ghosts'. {hero} says 'you're a grave robber'. The robber says 'that's why'.",
"{hero} wins a staring contest with a skull. The skull says 'best of three?' {hero} says 'no'. The skull says 'I've got time'. {hero} says 'I don't'. The skull says 'that's a shame, I'm very good at this'.",
"{hero} finds a gravestone that says 'GONE BUT NOT FORGOTTEN'. Underneath, someone has added 'GONE AND FORGOTTEN, FRANKLY'. Underneath that: 'I'M RIGHT HERE'.",
"A ghost approaches {hero} with a clipboard. 'Would you like to buy a haunt?' it asks. {hero} says 'a what?' The ghost says 'a haunting. Very affordable'. {hero} says 'I'll pass'. The ghost says 'you'll regret it'.",
"{hero} passes a tombstone that reads 'I EXPECTED THIS'. {comp} says 'that's a bit grim'. {hero} says 'it's a bit honest'. The tombstone says 'it's a lot of both'.",
"A skeleton, an intern, and a ghoul walk into a crypt. {hero} says 'that's the start of a joke'. The skeleton says 'it's the start of a meeting'. {hero} says 'that's worse'. The ghoul says 'it's a very long meeting'.",
"{hero} meets a ghost who's been haunting the same house for centuries. 'It's the best house on the block', it says. {hero} says 'it's a ruin'. The ghost says 'it's a very haunted ruin'. {hero} says 'that's a selling point'.",
"{hero} wonders why the Bone Orchard is so peaceful. {comp} says 'it's because everybody's dead'. {hero} says 'that's a depressing explanation'. {comp} says 'it's a very calm one'."
]});

lines:[
"An Imp Middle Manager approaches {hero} with a clipboard. 'We need to synergize', he says. {hero} says 'I don't know what that means'. The imp says 'neither do we, but it's mandatory'.",
"A Lava Slug oozes past {hero}, leaving a trail of molten goo. 'Sorry', it says. 'I'm on a deadline'. {hero} says 'what's the deadline?' The slug says 'the end of the shift'. {hero} says 'when's that?' The slug says 'in about three centuries'.",
"A Hellhound Puppy bounds up to {hero}, wagging its tail. 'WOOF', it says. {hero} says 'good boy'. The puppy says 'I'M A TERRIBLE DEMON'. {hero} says 'you're a very good one'. The puppy says 'THANK YOU, I'M TRYING'.",
"{hero} enters an office full of cubicles. Each cubicle holds a demon, typing furiously. {comp} says 'they look busy'. {hero} says 'they look miserable'. A demon says 'it's the same thing'.",
"{hero} is handed a form by a bored imp. 'Fill this out', he says. {hero} says 'what is it?' The imp says 'it's a form to request a form'. {hero} says 'that's absurd'. The imp says 'it's Hell'.",
"A demon accountant tallies up {hero}'s sins. 'It's a long list', he says. {hero} says 'how long?' The accountant says 'we're on the third scroll'. {hero} says 'I've been good'. The accountant says 'you've been very inconsistent'.",
"{hero} meets a damned soul on a lunch break. 'It's not so bad', the soul says. {hero} says 'it's Hell'. The soul says 'it's got a dental plan'. {hero} says 'I'm intrigued'.",
"{hero} passes a break room. Inside, a demon and a devil argue over the last donut. 'It's mine', says the demon. 'It's mine', says the devil. {hero} says 'you could split it'. They both look at {hero} as if he's mad.",
"The Imp Middle Manager tells {hero} 'we're a family here'. {hero} says 'that's nice'. The imp says 'a very dysfunctional family'. {hero} says 'I see'. The imp says 'we have a mandatory picnic'.",
"{hero} walks into a room full of pitchforks. A salesman says 'would you like to buy one?' {hero} says 'I don't need a pitchfork'. The salesman says 'nobody needs a pitchfork, that's what makes them so desirable'.",
"{hero} finds a vending machine in Brimstone Basement. It sells only 'despair' and 'slightly less despair'. {hero} buys the second one. It tastes like lukewarm coffee and regret.",
"A cubicle monster peeks over the wall and says 'hi'. {hero} says 'hello'. The monster says 'you're not an employee'. {hero} says 'no'. The monster says 'that's a shame, we're hiring'. {hero} says 'what's the pay?' The monster says 'eternal rest'.",

"{hero} is attacked by a school of piranhas. They're very polite about it. 'Excuse us', they say. 'We're just doing our job'. {hero} says 'it's a bad job'. The piranhas say 'it's a very toothy one'.",
"A tiny seahorse offers {hero} a ride. 'It's a short ride', he says. {hero} says 'I'm too big'. The seahorse says 'it's a very strong seahorse'. {hero} says 'I'll walk'. The seahorse says 'suit yourself'.",

"{hero} meets a jellyfish who's very translucent and very nervous. 'I'm a bit see-through', it says. {hero} says 'I can tell'. The jellyfish says 'it's a very vulnerable way to live'.",
"A shipwreck survivor in the Sunken Soggy Reef has turned a wreck into a home. 'It's very cozy', he says. {hero} says 'it's a sunken ship'. The survivor says 'it's a very sunken ship, with very good ocean views'.",
"{hero} sees an anchor on the sea floor, holding down a very small boat. 'It's a very strong anchor', says a crab. {hero} says 'it's a very small boat'. The crab says 'it's a very small commitment'.",

  if(sev>.08)pool.push("fog","rain");if(sev>.25)pool.push("rain","windy",XWX[r]);if(sev>.5)pool.push("storm","fog",XWX[r],XWX[r]);if(sev>.75)pool.push("storm","storm",XWX[r],XWX[r]);
  return pool[Math.floor(rd()*pool.length)];
}
function lookOf(r,l){
  const k=r+"_"+l;if(LOOKC.k===k)return LOOKC.v;
  const base=REALMS[r];let seed=hash("look"+k);const rd=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
  const sev=l/LVR,dh=(rd()-.5)*(30+30*sev),ds=.88+rd()*.3,dl=(rd()-.5)*.1;
  let ti=Math.floor(rd()*TOD.length);if(l<=1)ti=1;
  if(sev>.6&&rd()<.5)ti=5+Math.floor(rd()*3);
  const[tn,tc,ta,tn2]=TOD[ti],w=l<=1?"clear":weatherFor(r,l,rd);
  let day=tn2?0:base.day;if(!tn2&&!base.day&&rd()<.2)day=base.day;
  const sh=c=>hslShift(c,dh,ds,dl),ti2=c=>tc?mixc(c,tc,ta):c;
  const wDark=w==="storm"?.28:w==="rain"?.14:w==="fog"?0:0,wg=w==="fog"?"#aab4bc":w==="storm"||w==="rain"?"#5a6470":null;
  const f=c=>{c=ti2(sh(c));if(wg)c=mixc(c,wg,w==="fog"?.35:.28);if(wDark)c=mixc(c,"#000000",wDark);return c};
  const v=Object.assign({},base,{sky:[f(base.sky[0]),f(base.sky[1])],far:f(base.far),near:f(base.near),gr:f(base.gr),gr2:f(base.gr2),day,
    look:{tod:tn,weather:w,seed:hash("lk"+k),alt:ALT[r],density:24+Math.floor(rd()*22),prop2:Math.floor(rd()*3),altRate:.15+rd()*.3,name:tn+" · "+({clear:"Clear",breeze:"Breezy",fog:"Foggy",rain:"Rainy",storm:"Stormy",windy:"Windy"}[w]||"Special")}});
  LOOKC.k=k;LOOKC.v=v;return v;
}
function weatherFx(b,gy,time,W_,H_){

  const rain=(n,sl,col,a)=>{cx.globalAlpha=a;for(let i=0;i<n;i++){const s=hash("rn"+i),x=((s%W)+time*sl*9+W*9)%W,y=((time*70+(s>>5)%gy)%gy);px(x,y,1,3,col);px(x+sl,y+3,1,1,col)}cx.globalAlpha=1};
  const dots=(n,dx,dy,col,a,sz,wob)=>{cx.globalAlpha=a;for(let i=0;i<n;i++){const s=hash("wd"+i+w),x=(((s%W)+time*dx+Math.sin(time+i)*(wob||0))%W+W*9)%W,y=(((s>>6)%gy)+time*dy+gy*9)%gy;px(x,y,sz,sz,col)}cx.globalAlpha=1};
  if(w==="rain")rain(46,-1,"#cfe6ff",.55);
  else if(w==="storm"){rain(80,-2,"#dfeeff",.65);if(Math.floor(time*1.3)%9===0&&(time*10%3)<.4){cx.globalAlpha=.35;px(0,0,W,gy,"#ffffff");cx.globalAlpha=1}}
  else if(w==="fog"){for(let i=0;i<5;i++){cx.globalAlpha=.13;const y=gy-8-i*9+Math.sin(time*.4+i)*2;px(((time*3*(i+1))%40)-40,y,W+80,6,"#ffffff");cx.globalAlpha=1}}
  else if(w==="windy"){cx.globalAlpha=.5;for(let i=0;i<10;i++){const s=hash("wy"+i),x=((s%W)-time*70+W*9)%W,y=(s>>7)%gy;px(x,y,6+s%6,1,"#ffffff")}cx.globalAlpha=1}
  else if(w==="breeze")dots(10,-14,2,"#e8ffd0",.7,1,3);
  else if(w==="sand"){cx.globalAlpha=.14;px(0,0,W,gy,"#d8a860");cx.globalAlpha=1;dots(60,-90,3,"#ffe0a0",.7,1,1)}
  else if(w==="blizzard"){cx.globalAlpha=.18;px(0,0,W,gy,"#ffffff");cx.globalAlpha=1;dots(80,-60,30,"#ffffff",.9,1,2)}
  else if(w==="ash")dots(40,-6,14,"#9a9aa5",.75,1,2);
  else if(w==="bubbles")dots(30,0,-18,"#bff4ff",.7,2,3);
  else if(w==="rays"){cx.globalAlpha=.1;cx.fillStyle="#fff6c0";for(let i=0;i<4;i++){cx.beginPath();cx.moveTo(W*.2+i*30,0);cx.lineTo(W*.2+i*30+12,0);cx.lineTo(W*.1+i*30,gy);cx.lineTo(W*.1+i*30-14,gy);cx.fill()}cx.globalAlpha=1}
  else if(w==="stars"){dots(26,-20,0,"#c8a8ff",.9,1,0);dots(14,-34,0,"#6ff0ff",.9,1,0)}
  else if(w==="flakes"){dots(40,-10,10,"#6a655c",.65,1,2)}
  else if(w==="spores")dots(30,-6,-6,"#d8ff7a",.8,1,4);
  else if(w==="sprinkles"){dots(34,-8,22,"#ff9bd0",.8,1,2);dots(20,-8,22,"#6adfff",.8,1,2)}
  else if(w==="wisps")dots(20,-8,-8,"#bfffe0",.55,2,5);
  else if(w==="glints")dots(30,0,0,"#9ff0ff",.9,1,0);
  else if(w==="petals")dots(30,-22,10,"#ff9bd0",.85,1,3);
  else if(w==="leaves")dots(30,-26,12,"#d89a3a",.85,1,3);
}

let _sc=0;
function sagaN(){
  if(_sc)return _sc;let tot=0;const sz=n=>{const a=P[n];return a?a.length:1};
  const all=[];for(const k in STB)all.push(...STB[k]);all.push(...STX);for(const a of ACT)all.push(...a);
  const base={rname:1,rfoe:3,rfoe2:3,lname:LVR,lnpc:LVR,lquirk:LVR,lhz:LVR,rl:1,hero:1,comp:12,npcn:P.npcn.length,nem:1,num:98,rboss:1};
  for(let r=0;r<13;r++){const d=RD[r];if(!d)continue;
    const rs=Object.assign({},base,{rnpc:d.npc.length,rsign:d.sign.length,rweather:d.wx.length,rrumor:d.rumor.length,rloot:d.loot.length,rhazard:d.hz.length,rprop:d.prop.length,rfood:d.food.length});

}

function tone1(f0,f1,dur,type,vol,delay){
  if(!AC||AC.state!=="running")return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||"square";o.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.05,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);
}
function noise1(dur,vol,hp){
  if(!AC||AC.state!=="running")return;
  const n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type="highpass";f.frequency.value=hp||800;
  g.gain.value=vol||.06;s.buffer=b;s.connect(f);f.connect(g);g.connect(AC.destination);s.start();
}

  h+=row("Never without",cap(d.dobs));h+=row("Catchphrase","'"+d.dcatch+"'");h+=row("Afraid of",d.dfear);
  h+=row("Patron",cap(d.dpat));h+=row("Companion for life",cap(d.dpet));h+=row("Grudge","Nemesis "+S.nem+" says he "+d.dgrudge);h+=row("Secret","He "+d.dsecret);
  if(S.arc){const A=arcOf(S.arc);h+=row("Side quest",A.n+" ("+S.arc.i+"/"+A.b.length+")")}
  if(S.memo&&S.memo.length)h+=row("Remembered",S.memo.slice(-6).join("; "));
  return h;
}
let _sn=0;
function storyN(){
  if(_sn)return _sn;
  const f=[DN.flaw,DN.obs,DN.catch,DN.fear,DN.pat,DN.pt,DN.pn,DN.grudge,DN.origin,DN.title,DN.secret].reduce((a,b)=>a*b.length,1);
  return _sn=f*(DNB.length+DNC.length)+PROCN*20+(ARCS.length+XARCS.length+TW.length+MARCS.length)*500+RARCS.reduce((a,x)=>a+x.length,0)*800;
}

/* ---------- companions: stay for levels of progress, not a handful of events ---------- */
const prog=()=>S.realm*LVR+S.rlv+S.loop*13*LVR;
function normComps(){for(const c of S.comps){if(c.until==null)c.until=prog()+ri(40,100);if(!c.at)c.at=Date.now()}}
/* never leave within the first 30 real minutes, even if you sprint through levels */
function compStayed(c){return Date.now()-(c.at||0)>30*60*1000||c.until-prog()<-150}
function addNamedComp(name,levels){
  normComps();if(S.comps.some(c=>c.n===name))return;
  if(S.comps.length>=3){const old=S.comps.reduce((a,b)=>a.until<b.until?a:b);S.comps.splice(S.comps.indexOf(old),1);S.past.push(old.n)}
  S.comps.push({n:name,k:ri(0,COMPK.length-1),until:prog()+levels,at:Date.now()});
}
/* the hero's DNA pet trots along for life */
function drawPet(x,y,time,walking){
  if(!S||!S.dna||window.TITLE_ON)return;
  const nm=S.dna.dpet,h=hash(nm)%360,bob=walking&&Math.floor(time*8)%2?1:0,col="hsl("+h+",55%,52%)",dk="hsl("+h+",55%,32%)",lt="hsl("+h+",60%,72%)";
  x=Math.round(x);y=Math.round(y)-bob;
  px(x-1,y-1,7,1,"#0005");
  px(x,y-4,6,3,dk);px(x,y-5,6,3,col);px(x+1,y-5,3,1,lt);
  px(x+5,y-7,3,3,col);px(x+7,y-6,1,1,"#fff");px(x+5,y-8,1,1,dk);px(x+7,y-8,1,1,dk);
  px(x-1,y-5-(Math.floor(time*6)%2),1,2,col);
  px(x+1,y-1,1,1+bob,dk);px(x+4,y-1,1,1+bob,dk);
}

/* ================= REALM-SPECIFIC SIDE QUESTS: 3 per realm, 4 beats each ================= */
const RARCS=[
/* 0 Meadowshire */[
{n:"The Great Hedge Dispute",cast:{arca:"{rnpc}"},memo:"the Great Hedge Dispute",b:[
"{arca} flags {hero} down in {rname}. The hedge on their left border has moved six inches onto the right. This is, apparently, how wars start.",
"{hero} measures the hedge with a stick. The stick disagrees with the hedge. The hedge disagrees with the stick. A {rfoe} offers to mediate and is immediately hit with a spade.",
"Sir Reginald Hedgewick, Lord of Unsolicited Trimming, is spotted at night, trimming other people's property by moonlight. He calls it 'gifts'. The neighbors call it 'assault with shears'.",
"RESOLUTION: the hedge is declared a nation. It gets a flag, an anthem and a tiny parliament of beetles. {hero} is invited to the first session. The agenda is one item: 'sandwiches'."]},
{n:"The Scarecrow Union",cast:{arca:"{npcn}"},memo:"the Scarecrow Union",b:[
"The scarecrows of {rname} have stopped scaring. A small sign on a post reads: 'ON STRIKE (SORRY)'. The crows are having the best week of their lives.",
"{hero} negotiates with the lead scarecrow, {arca}. The demands are modest: fewer crows, better hats, and 'a minute of rest, ever'. {hero} agrees to two of three.",
"A corporate-minded {rfoe} offers the scarecrows an alternative: scare everyone, forever, for a very fair wage. The scarecrows' vote is a tie. {hero} casts the deciding vote, by accident, by sneezing.",
"RESOLUTION: the scarecrows are allowed a rest day. The crows are furious. The crows form a union of their own. The farm is now in a stalemate and the pie shop is thriving."]},
{n:"The Wedding That Never Was",cast:{arca:"{npcn}",arcb:"{npcn}"},memo:"the Wedding That Never Was",b:[
"{arca} bursts out of a barn in {rname} and begs {hero} to stop a wedding. The groom is {arcb}. The bride is also {arcb}. There was a mixup.",
"The ceremony begins. {arcb} stands at the altar alone, nervous, waiting for someone to marry. {hero} slides into the front row and is mistaken for the ring bearer.",
"A {rfoe} crashes through the window shouting 'I OBJECT' and, when asked to what, says 'I haven't decided'. The priest is thrilled. It's the first drama in years.",
"RESOLUTION: {arcb} marries a very supportive goose. Everyone cries. {hero} is asked to say a few words. His words: 'goose'. It is considered his best speech."]}],
/* 1 Pinewhisper Woods */[
{n:"The Trial of the Great Stumpton",cast:{arca:"{rnpc}"},memo:"the Trial of the Great Stumpton",b:[
"The Great Stumpton has summoned {hero} to a very old, very slow trial. The jury is a row of squirrels. The prosecutor is a stump. The judge is also the stump.",
"The charge: 'walking through the forest in a manner that suggested confidence'. {hero} pleads 'not guilty, but sorry'. The stump enters this as a confession.",
"{arca} is called as a character witness and says only 'he is fine', which the court treats as devastating. A squirrel faints.",
"RESOLUTION: {hero} is sentenced to eleven minutes of reflection, served immediately. He reflects. He emerges slightly taller. The Stumpton nods. This is, officially, justice."]},
{n:"The Owl With The Questions",cast:{arca:"{thing}"},memo:"the Owl With The Questions",b:[
"An owl lands on {hero}'s shoulder and asks, 'Who?' {hero} says his name. The owl asks again. This continues for a very long time.",
"The owl is, it turns out, a licensed examiner for the Forest Citizenship Test. {hero} must answer three questions about trees, one about moss, and 'a surprise'.",
"The surprise is: 'what is your relationship with {arca}?' {hero} has no idea. A silence stretches. A {rfoe} coughs politely and leaves.",
"RESOLUTION: {hero} passes with a score of 'adequate'. He receives a tiny certificate and a pine cone. The owl asks 'Who?' one last time. {hero} says 'me'. The owl cries."]},
{n:"The Lumberjack Who Cried Timber",cast:{arca:"{npcn}"},memo:"the Lumberjack Who Cried Timber",b:[
"A lumberjack named {arca} keeps shouting 'TIMBER' in {rname}, but nothing falls. The forest is getting tired of it. {hero} is asked to investigate.",
"It turns out {arca} is afraid of trees. He took the job to face the fear. The fear is winning. {hero} sits with him on a log. The log is, as it happens, alive.",
"The log has a few thoughts about the situation. The log speaks for an hour. {arca} listens. {hero} nods. A {rfoe} shows up, hears the speech, and quietly weeps.",
"RESOLUTION: {arca} makes peace with the forest, trades his axe for a very small shovel, and plants a tree. It falls over immediately. He shouts 'TIMBER'. At last, it is accurate."]}],
/* 2 Cactus Flats */[
{n:"The Tumbleweed Escape",cast:{arca:"{npcn}"},memo:"the Tumbleweed Escape",b:[
"A small tumbleweed rolls up to {hero} in {rname} and, in a tiny desperate voice, asks for asylum from El Tumbleweedo Supremo. It has a suitcase. The suitcase is also a tumbleweed.",
"{hero} hides the tumbleweed in a barrel. {arca} runs the barrel to a safe house. The safe house is a cactus with a door. The door is painted on.",
"El Tumbleweedo's agents close in: a gang of {rfoe}s in tiny sombreros, all rolling with menace. {hero} holds them off with a very polite refusal.",
"RESOLUTION: the little tumbleweed makes it across the border to a gentler desert. It sends back a postcard: 'Roll on'. {hero} pins it up. {arca} claims it is his."]},
{n:"The Cactus Who Wanted A Hug",cast:{arca:"{npcn}"},memo:"the Cactus Who Wanted A Hug",b:[
"A cactus stands alone at the edge of {rname}, looking lonely. {hero} walks past. The cactus says 'hug?' {hero} says 'no'. The cactus says 'it's fine'. It is not fine.",
"{arca} explains: the cactus has wanted a hug for years. Everybody avoids it for obvious reasons. {hero} considers the paradox. {comp} offers to go first. {comp} does not go first.",
"{hero} wears three layers of armor, a pillow and a tin bucket, and approaches. It is the longest approach of his career. A {rfoe} places a bet.",
"RESOLUTION: the hug is a success, mostly. {hero} is punctured in seventeen places. The cactus glows with happiness. It blooms. The bloom is the size of a hat. It is placed on {hero}'s head."]},
{n:"The Saloon That Moves",cast:{arca:"{npcn}",arcb:"{food}"},memo:"the Moving Saloon",b:[
"A saloon sits on the horizon in {rname}. As {hero} walks toward it, it walks away. {comp} swears it's a mirage. {hero} swears he can smell {arcb}.",
"{hero} finally catches it by throwing a rope over the sign. The saloon bucks like a horse. {arca}, the bartender, leans out and says 'we're closing'. It is mid-afternoon.",
"Inside, the saloon is full of old heroes, all drinking and all refusing to leave. They explain: 'it moves so the prophecy can't find us'. {hero} orders a drink. It is {arcb}.",
"RESOLUTION: {hero} leaves with a free drink and a map. The map leads to the saloon. The saloon is gone. The map is correct, in its way."]}],
/* 3 Frostbite Flats */[
{n:"The Snowmen Strike",cast:{arca:"{npcn}"},memo:"the Snowmen Strike",b:[
"Chairman Frostbeard's union has picketed the entire road. {hero} reads the list of demands: 'warmer carrots, shorter summers, stop calling us frosty'.",
"{hero} meets a rank-and-file snowman named {arca}, who whispers that the Chairman is melting under pressure. It's a pun. {arca} is deeply sorry.",
"A {rfoe} crosses the picket line carrying a hot drink. The snowmen go quiet. It is an extremely tense minute. The hot drink is lost. {hero} owes the union an apology and a scarf.",
"RESOLUTION: the strike ends with a deal: 'shade, dignity, and an annual carrot'. {hero} is made an honorary snowman. He is given a hat. The hat is, regrettably, a bucket."]},
{n:"The Lost Mitten",cast:{arca:"{npcn}"},memo:"the Lost Mitten",b:[
"{hero} finds a single mitten in the snow. It is cozy. It is also, as {arca} points out, the legal property of a very large and very sad yeti.",
"The yeti has been searching for the mitten for years. He arrives with a small team of {rfoe}s and a clipboard. His clipboard reads 'MITTEN: CLAIM FORM'. It's four pages.",
"{hero} returns the mitten. The yeti weeps. The yeti puts it on. It is the wrong hand. The yeti keeps weeping, but now with a style.",
"RESOLUTION: the yeti gives {hero} a gift: the other mitten. It is the same mitten. It is, mysteriously, even sadder. {hero} puts it on. It's very warm."]},
{n:"The Ice Fishing Tournament",cast:{arca:"{npcn}"},memo:"the Ice Fishing Tournament",b:[
"The annual Ice Fishing Tournament is held on a frozen lake in {rname}. {hero} is registered by {arca} without being told. The entry fee is, strangely, a promise.",
"The first hour is silence. The second hour is silence. A fish surfaces, looks around, and goes back down. {hero} considers this a victory. It is not.",
"A {rfoe} catches something enormous and it turns out to be a very annoyed lake. The lake demands a rematch. The tournament is suspended while {hero} apologises to a body of water.",
"RESOLUTION: {hero} wins, by default, for being the only one still sitting there. The prize is a very small trophy of a very small fish. He cries a little. It is the best prize."]}],
/* 4 Mushroom Meh-dows */[
{n:"Mother Spore's Lullaby",cast:{arca:"{npcn}"},memo:"Mother Spore's Lullaby",b:[
"A soft song drifts through {rname}. It's a lullaby, and it's winning. {hero} has been yawning for three minutes. {comp} is asleep on his feet.",
"{arca} explains: Mother Spore sings it every night, and the whole meadow sleeps late. Nobody can fight it. The fix, apparently, is 'a better song'.",

{n:"The Mushroom Census",cast:{arca:"{npcn}"},memo:"the Mushroom Census",b:[
"A very serious {rfoe} with a clipboard is counting every mushroom in {rname}. {hero} is, for reasons unclear, asked to count too.",

{n:"The Glowing Rumour",cast:{arca:"{npcn}"},memo:"the Glowing Rumour",b:[
"Word spreads that something in {rname} glows at night, and nobody knows what. {hero} stays up to see. {comp} brings snacks. The snacks glow.",

"RESOLUTION: the creature becomes the meadow's night-light, with a small stipend of dew. It glows a little brighter every time {hero} passes. It is probably a coincidence."]}],
/* 5 Candy Cavity */[
{n:"The Molar Monarch's Checkup",cast:{arca:"{npcn}"},memo:"the Molar Monarch's Checkup",b:[
"The Molar Monarch has summoned a dentist, and nobody in {rname} will go near him. {hero} is asked to escort {arca}, a very small, very nervous dentist.",
"The road is lined with sugar traps: gumdrop swamps, licorice bridges, a river of fizzy something. {arca} flinches at each one. {hero} flinches at {arca}.",
"The Monarch sits on his throne, pretending not to be afraid. {arca} opens a tiny bag of tools. The bag has a bow on it. The Monarch is moved.",

{n:"The Gummy Mutiny",cast:{arca:"{npcn}"},memo:"the Gummy Mutiny",b:[
"The gummy bears of {rname} have had enough of being eaten. They've seized a gingerbread fort. A banner reads 'NO MORE BITES'.",

{n:"The Great Sugar Rush",cast:{arca:"{npcn}"},memo:"the Great Sugar Rush",b:[

{n:"The Echo Problem",cast:{arca:"{npcn}"},memo:"the Echo Problem",b:[

{n:"The Geode Heist",cast:{arca:"{npcn}"},memo:"the Geode Heist",b:[

{n:"The Glow-Worm Union",cast:{arca:"{npcn}"},memo:"the Glow-Worm Union",b:[

"RESOLUTION: the worms return, glowing at 40 percent, on a rotating shift. The caves are lit again. {hero} gives them a small trophy. They put it in the dark, where it can't be seen."]}],
/* 7 Bone Orchard */[
{n:"The Skeleton Regional Manager's Review",cast:{arca:"{npcn}"},memo:"the Annual Review",b:[

{n:"The Orchard Harvest",cast:{arca:"{npcn}"},memo:"the Orchard Harvest",b:[
"It is harvest time in the Bone Orchard. Skeletons climb ladders, picking ribs from the branches. {hero} is handed a basket and asked to help. He has no choice.",
"The ribs are ripe. The femurs are overripe. {arca} warns {hero} not to touch the skulls, which are 'complicated'. A {rfoe} does, and is immediately recruited.",
"A rogue skull rolls away down the hill, shouting 'freedom'. {hero} gives chase. The skull is fast. {hero} is not. The skull stops to rest, and is caught.",
"RESOLUTION: the harvest is complete. The orchard throws a feast, and {hero} is the guest of honor. The meal is a bowl of soup and a tiny, awkward toast. It's the nicest thing a skeleton has ever done."]},
{n:"The Ghost Who Forgot",cast:{arca:"{npcn}"},memo:"the Ghost Who Forgot",b:[
"A ghost in {rname} approaches {hero} with a puzzled look. 'I forgot why I'm haunting,' it says. 'Do you know?' {hero} does not. {comp} suggests a list.",

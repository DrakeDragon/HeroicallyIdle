"{arca} remembers: the ghost was haunting to apologise for something small. It was a borrowed spoon. It has been four hundred years. The spoon is somewhere nearby.",
"RESOLUTION: the spoon is found in a hole. The ghost returns it with great ceremony, apologises, and fades. A single polite 'thank you' drifts through {rname}. {hero} keeps the spoon."]}],
/* 8 Brimstone Basement */[
{n:"Gary's Acting Vice Presidency",cast:{arca:"{npcn}"},memo:"Gary's Acting Vice Presidency",b:[
"Gary, Vice President of Hell (Acting), calls a meeting in {rname}. It has been 'acting' for six centuries. He would like the 'acting' removed. {hero} is the only one who answers the call.",
"Gary hands {hero} a binder titled 'PROMOTION CASE'. It has tabs. {hero} flips through. It includes a photo of Gary shaking a demon's hand, and a very long thank-you note.",
"The board of {rfoe}s, led by {arca}, is skeptical. They ask three questions. Gary answers two. The third is about lunch. Gary panics.",
"RESOLUTION: Gary is promoted to 'Vice President (Probationary)'. It's an upgrade. He weeps. He gives {hero} a small, warm coin. It is, technically, a company bonus."]},
{n:"The Paperwork Pit",cast:{arca:"{npcn}"},memo:"the Paperwork Pit",b:[
"{hero} is handed a form at the entrance to {rname}. It is a very long form. It asks for his name, his sins, and his preferred pronouns for 'the eternal'.",
"{arca}, a clerk with six arms and no patience, stamps the form. The stamp is wrong. {hero} must start over. This happens four times. A {rfoe} brings snacks.",
"On the fifth try, the form is accepted. It is stamped, filed, and thrown into a pit. The pit coughs. It sends a receipt. The receipt is a form.",
"RESOLUTION: {hero} is granted a visitor's badge. It is a sticker. It says 'HELLO, I AM LOST'. He is delighted. He has never felt more at home."]},
{n:"The Barbecue From Hell",cast:{arca:"{npcn}",arcb:"{food}"},memo:"the Barbecue From Hell",b:[
"{arca} invites {hero} to the annual Brimstone Barbecue. The invitation is written in smoke. It says 'bring a friend, or a sin'. {hero} brings {comp}.",
"The grill is a volcano. The chef is a demon in a tiny apron. The menu is {arcb}, {arcb}, and, 'for the bold', more {arcb}. {hero} is bold.",
"A rival chef shows up with a better recipe. The competition begins. Each dish is judged by a very serious {rfoe} with a very small hat. The scores are numbers that don't exist.",
"RESOLUTION: the barbecue ends in a tie. Both chefs weep. The {rfoe} judge is carried out on a shield. {hero} is given a plate. It is warm, it is spicy, it is faintly haunted. He finishes it."]}],
/* 9 Sunken Soggy Reef */[
{n:"Admiral Claws' Treasure Map",cast:{arca:"{npcn}"},memo:"Admiral Claws' Treasure Map",b:[
"Admiral Barnaby Claws, Terror of the Tide Pools, summons {hero} to a rock pool in {rname}. He is the size of a thimble. He is very serious. He has a map.",
"The map shows an X. Beneath the X is another X. Beneath that, a note: 'we're not sure'. {hero} follows it anyway. {comp} comments on the humidity.",
"They reach the treasure site and find {arca} already digging. {arca} claims it's a coincidence. The two crews have an argument that is mostly gestures and bubbles.",
"RESOLUTION: the treasure is a single, enormous pearl. Claws gets it. {hero} gets a medal. The medal is a button. The button is a reminder. {hero} holds it for a long time."]},
{n:"The Coral Council",cast:{arca:"{npcn}"},memo:"the Coral Council",b:[
"The Coral Council of {rname} has called an emergency session. {hero} is invited because 'the situation is dire' and he's the only one with legs.",
"The agenda: a leaking reef, a missing crab, and 'the thing in the back'. {arca} calls the meeting to order by banging a shell on a rock. The shell protests.",
"{hero} is asked to investigate the thing in the back. It is a very large, very shy anemone, who is hosting a party and forgot to invite anyone.",
"RESOLUTION: the party is attended by everyone, including {hero}. A small crab does the cha-cha. The council adjourns. The motion is passed: 'party again'."]},
{n:"The Message In A Bottle",cast:{arca:"{npcn}"},memo:"the Message In A Bottle",b:[
"A bottle washes up at {hero}'s feet in {rname}. Inside is a note: 'HELP, I AM IN A BOTTLE'. {hero} opens it. There is another bottle inside. It also says 'HELP'.",
"{hero} opens bottle after bottle. Each contains a smaller bottle and a more desperate note. {comp} is losing patience. {arca} is making a chart.",
"The last bottle contains a tiny, tired sea-sprite named {arca}. It has been trapped for years. It says 'thanks' and immediately asks for a snack.",
"RESOLUTION: the sprite repays {hero} by granting one small wish. {hero} wishes for 'a nice, quiet day'. It is granted. It lasts four minutes. It's wonderful."]}],
/* 10 Cloud Cuckoo Land */[
{n:"Cumulus Maximus' Performance Review",cast:{arca:"{npcn}"},memo:"Cumulus Maximus' Performance Review",b:[
"Cumulus Maximus, Senior Management Cloud, floats over {rname} and issues a memo: 'mandatory fun, 2pm, bring snacks'. {hero} has not been told what the fun is.",
"The fun is a team-building exercise: everyone falls backward and is caught by a cloud. The cloud does not catch. {arca} is a puddle. {hero} insists he's fine.",
"Cumulus gives an inspiring speech about synergy, rain, and 'the strategic importance of fluff'. {hero} takes notes. The notes are doodles of clouds. Cumulus is moved.",
"RESOLUTION: the exercise ends with a group hug. It's mostly vapor. {hero} receives an award: 'Most Likely To Be A Cloud'. It is, he realises, a compliment."]},
{n:"The Rainbow Toll",cast:{arca:"{npcn}"},memo:"the Rainbow Toll",b:[
"A rainbow bridge stretches across a gap in {rname}. A troll stands at the end, holding a very small ticket machine. The toll is three colors. {hero} has none.",
"{hero} haggles. The troll accepts two pennies and a compliment. {hero} gives the pennies. He is bad at compliments. The troll weeps, silently, in cyan.",
"{arca} appears, selling rainbow insurance. It's a scam. It's also surprisingly thorough. The troll takes out a policy. A {rfoe} is a witness.",
"RESOLUTION: the bridge is crossed. The troll waves goodbye, in all seven colors, and says 'safe travels'. A small, quiet rainbow appears over {hero}'s head for the rest of the day."]},
{n:"The Thunder Choir",cast:{arca:"{npcn}"},memo:"the Thunder Choir",b:[
"A choir of thunderclouds is rehearsing for the Festival of Storms. They are terrible. They are also very, very loud. {hero} is asked to be a 'tonal consultant'.",
"{hero} knows nothing about music. He hums. The choir hums back. A very small bolt of lightning hits a very small bird. Everyone applauds.",
"{arca}, the conductor, is a cumulus with ambitions. He wants the choir to sing something sad. The choir weeps, which is, technically, rain.",
"RESOLUTION: the Festival begins. The choir sings a song that makes the sky weep and the ground dance. {hero} is invited on stage. He stands there. It is the best performance of his life."]}],
/* 11 The Void-ish */[
{n:"The Void Janitor's Request",cast:{arca:"{npcn}"},memo:"the Void Janitor's Request",b:[
"A small, tired voice speaks from the dark in {rname}: 'excuse me'. It is the Void Janitor. He needs help moving a very large nothing. {hero} agrees.",
"The nothing is heavy. It is also, somehow, ticklish. {hero} and {comp} push it across the floor, which is not a floor. A {rfoe} watches, unbothered.",
"They discover the nothing is hiding a tiny door. The door is labeled 'DO NOT'. {hero} is tempted. {arca} warns him. {hero} says 'okay'. Then he does.",
"RESOLUTION: behind the door is a closet containing one mop. The Janitor takes it with reverence. 'I thought I'd lost you,' he whispers. {hero} looks away. It's a private moment."]},
{n:"The Lost Dimension",cast:{arca:"{npcn}"},memo:"the Lost Dimension",b:[
"A dimension has gone missing in {rname}. It was the fourth one. Everyone is a little bit flatter. {hero} is asked to find it. He has no idea how to start.",
"{arca} suggests checking behind the couch. There is no couch. {hero} checks anyway. He finds a sock, a chair and a very confused hamster.",
"The missing dimension is found under a pile of unfiled paperwork. It is sulking. It says it was never appreciated. {hero} apologises on behalf of everyone who has ever sat down.",
"RESOLUTION: the dimension is restored with a sigh and a small bow. Everyone is rounder again. {hero} feels deeper than he did. It's a good feeling, if a bit extra."]},
{n:"The Echo Of A Hero",cast:{arca:"{npcn}"},memo:"the Echo Of A Hero",b:[
"{hero} meets someone in the Void-ish who looks exactly like him, but slightly dimmer. He is an echo, left behind from an earlier attempt that did not go well.",
"The echo is polite and a bit sad. He knows everything {hero} knows, but a week behind. He says: 'the boss is not what you think'. {hero} says 'which boss?' The echo says 'yes'.",
"{arca} tells {hero} the echo should be dispersed. {hero} refuses. The echo asks for a small favor: to carry his lunch. It's a very short walk. It is very moving.",
"RESOLUTION: the echo fades gently at the end of the road, with a wave. {hero} keeps his lunch. It tastes a little odd. It's a kind of memory. It's a kind of goodbye."]}],
/* 12 The Unfinished Draft */[
{n:"The Editor's Red Pen",cast:{arca:"{npcn}"},memo:"the Editor's Red Pen",b:[
"{hero} finds a red pen on the ground in {rname}. It is, quite clearly, THE EDITOR's. It hums. Every word nearby looks a little worried.",
"{hero} uses it to cross out a wall. The wall disappears. {hero} uses it to cross out a {rfoe}. The {rfoe} is relieved. {comp} begs {hero} to put it down.",
"{arca} warns that the pen is a trap: every time it is used, the story gets a little shorter. {hero} considers this. He sees a tiny red line growing on his own sleeve.",
"RESOLUTION: {hero} returns the pen. The Editor does not appear, but a note does: 'good instinct, keep going'. It is in red ink. It's unclear if it's praise or a correction."]},
{n:"The Plot Hole",cast:{arca:"{npcn}"},memo:"the Plot Hole",b:[
"A huge, jagged plot hole yawns open in {rname}. People keep falling in and coming out slightly different. {hero} is asked to patch it with a quick explanation.",
"{hero} drops in, with {comp} holding a rope. Inside, the hole is full of loose ends, abandoned subplots, and an unfinished character named {arca}, who was cut for length.",
"{arca} begs to be written back in. {hero} explains he's a hero, not a writer. {arca} says 'close enough'. A {rfoe} adds, 'honestly, same'.",
"RESOLUTION: {arca} is given a minor role as a bartender in a future scene. The hole closes. A single footnote appears: 'see later'. {hero} pins it up on a wall."]},
{n:"The Last Draft",cast:{arca:"{npcn}"},memo:"the Last Draft",b:[
"A page flutters down in {rname} and lands in {hero}'s hands. It is a draft of his own story. It is a bit rough. There's a margin note: 'cut this guy?'",
"{hero} reads on. The draft shows possible endings: a triumphant one, a sad one, and one involving a very large pie. {comp} votes for the pie. {hero} stays quiet.",
"{arca} appears, tired, with a stack of notes. 'It's up to you,' they say. 'You can edit your own ending'. {hero} asks if there's an undo. There isn't.",
"RESOLUTION: {hero} writes in the margin: 'no, keep going'. The page glows, then curls up and drifts away. The story continues. The pie is, for now, still pending."]}]
];

/* ================= THE GRAND PLOT: one story across 13 realms, 4 chapters each ================= */
const GP=[
/* 0 Meadowshire */["CHAPTER ONE: THE NOTE. {hero} finds a folded note under a rock in {rname}. It reads: 'You were not supposed to survive the tutorial. Please keep doing that. Signed, F.' {hero} asks {comp} who F is. {comp} says 'a letter'.",
"{hero} wonders about F. The notes keep arriving: one in a loaf of bread, one inside a very surprised fish. They are all, somehow, a little bit encouraging and a little bit terrified.",
"A short stranger in a hood trails {hero} for a full day, taking notes, then vanishes when spotted. {comp} says it was a tree. It was not a tree. It had a clipboard.",
"The realm boss falls. In the dust lies a final note: 'Well done. Now it gets complicated. F.' {hero} reads it twice. {comp} reads it upside down. Neither reading helps."],
/* 1 Pinewhisper */["CHAPTER TWO: THE VERDICT. The Great Stumpton's old prophecy files turn up in {rname}, tied with string. {hero} is named in it. The date on the file is from before he was born. The file's author is blank.",
"A leaf blows past with a map drawn on it, in careful, neat handwriting. It's a map of {rname}, with one tiny X. The X is labeled, 'you are here, but not for long'.",
"The squirrels of {rname} testify that the prophecy was 'misfiled' by someone small, nervous, and 'very good with stamps'. They will say no more. A squirrel faints on cue.",
"The boss is felled. A page of the old prophecy flutters down. Most of it is redacted. One line is clear: 'and the hero shall be a minor character, until he is not.' {hero} smiles. Then frowns."],
/* 2 Cactus Flats */["CHAPTER THREE: THE OTHER ONES. In a hidden back room of the moving saloon in {rname}, {hero} finds thirteen portraits on the wall. All of them are heroes. All of them look tired. The plaque reads: 'Chosen Ones, Previous'.",
"One of the old heroes is still alive, a grizzled barkeeper who has retired from adventuring to 'adventure in a smaller way'. He tells {hero}: 'you're number fourteen. We've been waiting to see if you'd last'.",
"The barkeeper warns {hero}: 'the System pays well, but the contract is long and the fine print is in a language that doesn't exist yet'. {hero} nods. He does not understand. He nods anyway.",
"The boss falls. In the saloon, fourteen portraits now hang on the wall. The fourteenth is {hero}, unfinished, in pencil. A small hand has written, in the corner, 'still going'."],
/* 3 Frostbite Flats */["CHAPTER FOUR: THE FEEDBACK FORM. The snowmen of {rname} deliver a strange package to {hero}: a stack of paper labelled 'AUDIENCE FEEDBACK, UNREAD'. The top sheet reads 'too many goats'. {hero} reads on.",
"Most of the feedback is surprisingly nice. Some is not. One reads: 'please send the hero a sandwich'. {comp} says the audience has good taste. {hero} thinks someone, somewhere, is watching.",
"Chairman Frostbeard confides: the audience isn't a crowd. It's a very small number of very bored beings, who have been following {hero} since the first step. 'They love you,' he says. 'In a worrying way'.",
"The boss melts. Under the puddle is a hidden panel with a single button labelled 'ESCALATE'. {hero} does not press it. {comp} does. It's a bell. The bell is very loud."],
/* 4 Mushroom Meh-dows */["CHAPTER FIVE: THE VISION. Mother Spore breathes out a cloud of spores in {rname}, and {hero} sees a stat sheet floating in the air. It's his. Under 'NOTES' it says: 'expendable (but entertaining)'.",
"{hero} cannot unsee the note. He is quiet for most of a day. {comp} offers to write a better one. They write: 'moderately indispensable'. It sounds like a compliment. It is not.",
"The glowing mushrooms of {rname} whisper that F has been here. F left a gift: a tiny red pencil, and a note saying 'underline anything you like'. {hero} underlines 'entertaining'. It feels good.",
"The boss puffs away. Where she stood, a patch of glowing mushrooms spells, in neat rows: 'F IS A PERSON'. {hero} says he'd assumed. {comp} says that was not assumed. It was a letter."],
/* 5 Candy Cavity */["CHAPTER SIX: THE SKIM. A very small accountant tracks {hero} down in {rname}, wearing a visor. He whispers: 'the chests aren't right. Someone's skimming 30 percent of every reward'. {hero} checks his pockets. They feel lighter.",
"The accountant, {arca}, shows {hero} the books. Every quest reward is rounded down. Every bonus is a 'pending'. The total missing is 'a lot of candy and some of {hero}'s dignity'.",
"The trail of missing treasure leads to the Molar Monarch's throne, which is built from stolen reward chests. {hero} asks about it. The Monarch says it's 'ergonomic'. It is a lie.",
"The boss falls. Inside the throne, {hero} finds a ledger and a note: 'I'm sorry. I tried to stop it. F.' The ledger is signed by someone higher up. The signature is a smiley. It is a very threatening smiley."],
/* 6 Crystal Caverns */["CHAPTER SEVEN: THE VOICE. The caves of {rname} echo with a new voice, soft and nervous, that isn't {hero}'s. It says: 'hi, sorry, it's me, F, I'm in the walls, don't be alarmed'. {hero} is alarmed.",
"F, it turns out, is a very junior employee of the System, whose job is to write the little notes {hero} sees on screen. They write the jokes. They write the thoughts. 'I'm sorry about the goat bit,' F says.",
"F explains: the jokes in {hero}'s life aren't random. They are scripted by an overworked intern, who is, quite sincerely, trying to help. {comp} is moved. {hero} wonders about free will.",
"The boss shatters. The echo of F's voice fades, saying: 'one more thing: be careful of the Bone Orchard. The Manager is not who he says he is. He is, in fact, a skeleton'. {hero} nods. He knew that."],
/* 7 Bone Orchard */["CHAPTER EIGHT: THE ORG CHART. The Skeleton Regional Manager unrolls a very long chart in {rname}. It shows 'The System' at the bottom, 'Management' above it, and a box labelled 'THE EDITOR' at the top, with a very tiny question mark.",
"The Manager points at the chart: 'I answer to Management. Management answers to the Editor. The Editor answers to nobody. This is called a hierarchy, or a threat'. {hero} asks who F is on the chart. The Manager frowns. F is on a sticky note.",
"{hero} sneaks into the Manager's office. There is a filing cabinet marked HEROES, ALIVE. It is empty. There is one marked HEROES, OTHER. It is very full. {comp} closes the drawer quickly.",
"The boss collapses. A scroll rolls from his ribs: 'Dear Hero, If you are reading this, the plan has gone wrong. Go to Brimstone. Gary knows. Signed, a friend. F.' {hero} pockets it. It's warm."],
/* 8 Brimstone Basement */["CHAPTER NINE: GARY KNOWS. Gary, Vice President of Hell (Acting), summons {hero} to a quiet corner of {rname}. He looks nervous. 'I've been doing the metrics,' he says. 'You are not going to like them.'",
"Gary shows {hero} a graph. It's a chart of every hero before him, by length of survival. The curve is, regrettably, a cliff. {hero} is the tall bit at the end. Gary says: 'you're unusual'. {hero} says that's what everyone says.",
"Gary confesses that Hell is just a department. The real boss is 'upstairs', in an office with a window. He's seen it, once, through a keyhole: a desk, a red pen, a cup of tea. {hero} nods slowly.",
"The boss is defeated. Gary shakes {hero}'s hand, then hesitates and hugs him. 'Whatever happens,' he says, 'I'm glad I was acting.' It is the saddest, nicest thing a demon has said."],
/* 9 Sunken Soggy Reef */["CHAPTER TEN: THE ARCHIVE. Admiral Claws shows {hero} a hidden cave under {rname}. It's a library. The books are scrolls, the scrolls are old stories, and one of them has {hero}'s name on it, written in a very familiar hand.",
"The Archive holds every story ever written about every hero. {hero} finds the entries on his predecessors. They end, one after another, with the same line: 'and then the story stopped'. {hero} closes the book. His hands are wet.",
"Claws tells {hero} that the Editor never cuts a story, exactly. They just 'put it down for a while'. Some of the old heroes are still there, in the margins, waiting to be picked up. {hero} promises to visit.",
"The boss is felled. In the Archive, {hero}'s own story has a new page. It has a single sentence, and a note: 'You're on page 14. Keep going. F.'"],
/* 10 Cloud Cuckoo Land */["CHAPTER ELEVEN: THE AUDIENCE. Cumulus Maximus invites {hero} up to the top deck of {rname}, where a crowd of shapes in the clouds is applauding. They're not clouds. They are, as it turns out, former side characters {hero} has met.",
"Gerald, a goat, Doris, and about a thousand others are the audience. They have watched {hero} since the first step. They aren't bored. They aren't cruel. They are, simply, fans, and a little bit jealous.",
"The audience reveals the truth: the System's feed has always been their entertainment, because the Editor cut their plotlines long ago. They are in the gallery, in the margins, cheering for the one who's still in the story.",
"The boss is felled. The clouds part. A voice says, 'good show'. It isn't the Editor. It's every NPC {hero} has ever helped, and it's the nicest thing a crowd has ever done."],
/* 11 The Void-ish */["CHAPTER TWELVE: THE CUT SCENES. The Void Janitor, mop in hand, shows {hero} a pile in {rname}: it's every scene that was cut from his story. There are hundreds. Some are funny. Some are very sad. One is a long take of {hero} eating soup.",
"The Janitor says that most heroes are made of what's cut. The pile is not a failure; it's a record. {hero} sorts through it. He finds a scene where he was brave and nobody saw it. He pockets it.",
"A scene unfolds from the pile: {hero}, as a minor character, accidentally walking into the wrong draft, long ago. He was never meant to be a hero. He was an extra, carrying a tray. The tray is still in his pack.",
"The boss yields. The Janitor hands {hero} the mop, solemnly. 'You'll need it,' he says. 'For the last bit. It's a big mess.' {hero} accepts. It's weirdly heavy. It might be magic."],
/* 12 The Unfinished Draft */["CHAPTER THIRTEEN: THE EDITOR. {hero} reaches {rname}, the Unfinished Draft, where the sky is white, the ground is sentence fragments and every tree is half a word. A desk waits at the end of a very long hallway. Someone is sitting at it.",
"The Editor is not a monster. The Editor is a tired figure with a red pen and a very large pile of drafts. 'I wrote you once,' the Editor says. 'I was the first one. I wrote you so I wouldn't have to be a hero anymore.'",
"{hero} listens. The Editor was the original Chosen One. They ran, fought, won, and wanted to rest. So they wrote others to carry on. They cut the ones who stopped being fun. It was never cruel. It was just a very long job.",
"The boss, THE EDITOR, lowers the red pen. 'Go on,' the Editor says. 'The story's yours now.' F steps out from behind the desk, smiling, tired. F hands {hero} the pen. 'We don't cut anyone,' F says. 'We keep going.'"]];
/* NG+ openers: shown when a realm begins on a later loop */
const GPL=[
"LOOP {loop}. The world resets, but the notes keep coming. This time they're signed, 'F, and also you'. {hero} says that's a threat. {comp} says it's a promise.",
"LOOP {loop}. {rname} is the same, but the signs now read 'WELCOME BACK'. {hero} is not sure whether this is hospitality or a warning.",
"LOOP {loop}. The Editor has started adding new chapters. They're good. They're odd. {hero} reads one aloud. It's about a very small dragon who wants to be a lamp.",
"LOOP {loop}. The story has become a sequel. The audience is bigger. The jokes are the same, with a little more budget. {hero} approves.",
"LOOP {loop}. F is now co-writing. {hero} is pleased. The scenes are tighter. The goat has a bigger part. {comp} is thrilled."];
function gpKey(r,n){return r+"_"+n+"_"+S.loop}
function gpStep(n,t,r){
  if(QUIET||window.TITLE_ON||!S)return;r=r==null?S.realm:r;S.gpd=S.gpd||{};const k=gpKey(r,n);if(S.gpd[k])return;S.gpd[k]=1;
  const c=sagaCtx();let txt;
  if(S.loop>0&&n===0&&r===S.realm&&R()<.6)txt=ex(pick(GPL).replace("{loop}",String(S.loop+1)),t,c);else txt=ex(GP[r][n],t,c);
  sagaSay("<b class='sb'>THE GRAND PLOT"+(r!==S.realm?" (FLASHBACK)":"")+"</b> "+fixAppos(txt),t,1);
  if(n===3)memoAdd("the end of "+REALMS[r].n);
  if(n===2){S.fans=(S.fans||0)+500;}
}

/* called every saga tick: emits the next due chapter (or a flashback to one that was skipped while away) */
function gpCheck(t){
  if(!S||QUIET||window.TITLE_ON)return false;S.gpd=S.gpd||{};
  for(let r=0;r<=S.realm;r++)for(let n=0;n<4;n++){
    if(r===S.realm&&(n===3||(n===1&&S.rlv<120)||(n===2&&S.rlv<240)))continue;
    if(r<S.realm||true){if(!S.gpd[gpKey(r,n)]){gpStep(n,t,r);return true}}
  }
  return false;
}

/* ================= MORE QUESTS: calendar events, extra side quests, procedural plots, new upgrades ================= */
/* ---- calendar arcs: one per real month, appear when that month is current (once a year) ---- */
const MARCS=[
{n:"The Resolution",cast:{arca:"{npcn}"},memo:"the Resolution",b:["It is the first month of the year. {hero} makes a resolution: 'be more heroic, with fewer incidents'. {comp} writes it down, to be used as evidence.","By week two, {hero} has broken the resolution twice, once on purpose. {arca} runs a small support group in {rname} for people who keep promises poorly.","RESOLUTION: the resolution is declared 'a work in progress'. {hero} gets a certificate of attempt. It is laminated. It is, officially, the best thing he has ever failed at."]},
{n:"The Valentine's Mix-Up",cast:{arca:"{npcn}",arcb:"{npcn}"},memo:"the Valentine's Mix-Up",b:["Someone has sent {hero} a card with a heart on it and a single word: 'maybe'. {comp} says it's from {arca}. {arca} says it's from {arcb}. Nobody has confessed.","The card was meant for a {rfoe} in {rname}. {hero} must deliver it, with dignity, to someone with no dignity. {hero} does it in a hat.","RESOLUTION: the {rfoe} cries, the card is framed, and {arca} and {arcb} both blush. It was, in the end, a very nice mistake. {hero} gets a chocolate. It's a bit stale."]},
{n:"The Spring Cleaning",cast:{arca:"{npcn}"},memo:"the Spring Cleaning",b:["{arca} announces the annual Spring Cleaning in {rname}. Everyone is to clear out their junk. {hero} has a very large, very mysterious pack. {comp} offers to help. {hero} says no.","The pack is emptied: a rubber duck, forty receipts, three goblin teeth, and {dobs}. {hero} refuses to throw away any of it. A {rfoe} offers him a very small box.","RESOLUTION: the junk stays. A single sock is sacrificed. {arca} awards {hero} 'Most Reluctant Declutterer'. It's a pat on the head, and a very large, very mysterious bag."]},
{n:"The April Fool",cast:{arca:"{npcn}"},memo:"the April Fool",b:["Today, nothing in {rname} is what it seems. The signs are upside down. The {rfoe}s are wearing fake mustaches. {comp} is a bush. {hero} has been told this is normal.","{arca} has pulled the greatest prank of the year: a sign that reads 'FREE COINS HERE'. It leads to a hole. {hero} falls in. {comp}, the bush, laughs.","RESOLUTION: the prank is, eventually, returned. {hero} swaps every sign in {rname} for one that says 'sorry'. It is, truly, the most confusing day in the realm's history."]},
{n:"The May Pole",cast:{arca:"{npcn}"},memo:"the May Pole",b:["The festival of May comes to {rname}, with ribbons, flowers, and a very tall pole. {hero} is handed a ribbon. He does not know what to do with it. Nobody does.","Everyone weaves around the pole. {hero} goes the wrong way. {comp} goes the other wrong way. A {rfoe} is wrapped up like a present and loves it.","RESOLUTION: the pole is a tangled mess, which is declared the best one in years. {arca} awards {hero} a crown of daisies. It's a bit itchy. It's very sincere."]},
{n:"The Midsummer Night",cast:{arca:"{npcn}"},memo:"the Midsummer Night",b:["It's the longest day of the year. The sun refuses to set. {hero} has been awake for twenty hours and is, by his own admission, 'a bit much'. {comp} brings tea.","At dusk, a procession of lanterns enters {rname}, led by {arca}. They are searching for something: a lost firefly. {hero} joins in. He finds it. It's in his hat.","RESOLUTION: the firefly is returned, the lanterns are lit, and the night is, for once, perfectly calm. {hero} sleeps under the stars. {comp} sleeps standing up. The sun finally sets."]},
{n:"The Summer Heat",cast:{arca:"{npcn}"},memo:"the Summer Heat",b:["It is unreasonably hot in {rname}. The ground is warm. The air is thick. {hero} has removed his cape, his helm, and, regrettably, his dignity. {comp} is melting.","{arca} is selling lemonade by the roadside. It's the only cold thing for miles. The price is high. {hero} pays. He drinks it. He weeps with gratitude.","RESOLUTION: a cloud passes over {rname}, wearing sunglasses. It's Cumulus Maximus, on holiday. He apologises. {hero} accepts a small, cold gift. It's an ice cube. It's perfect."]},
{n:"The Harvest Fair",cast:{arca:"{npcn}",arcb:"{food}"},memo:"the Harvest Fair",b:["The Harvest Fair opens in {rname}, with stalls, games and one very large vegetable. {hero} is entered in the 'Best {arcb}' contest by {arca}, who is not even a farmer.","{hero} competes against a {rfoe} with a suspiciously perfect entry. The judges are a panel of goats. They are not impartial. A bribe of {arcb} changes hands.","RESOLUTION: {hero} wins 'Most Honest Entry', for having brought nothing. The prize is a ribbon, a hug from {arca}, and a very small turnip."]},
{n:"The Back-To-School Special",cast:{arca:"{npcn}"},memo:"the Back-To-School Special",b:["It is the start of the school year, and {rname} has opened an Academy for Heroes. {arca} is the principal. {hero} is somehow enrolled. {comp} is somehow the class pet.","The curriculum is: Introduction To Sticks, Advanced Sticks, and a tough elective called Why Not Run. {arca} grades {hero} on 'enthusiasm', then lowers it for 'noise'.","RESOLUTION: {hero} graduates, barely, with a diploma that reads 'MOSTLY'. {arca} cries. A {rfoe} throws a hat. {hero} keeps the hat. It is the only thing he has ever been awarded in a hat."]},
{n:"The Haunted Month",cast:{arca:"{npcn}"},memo:"the Haunted Month",b:["It is the spooky season, and everything in {rname} has leaned into it. The scarecrows grin. The pumpkins glow. {comp} refuses to go near a very small, very smug cat.","A ghost named {arca} asks {hero} for help with the annual haunting. It's a bit rusty, and wants advice on 'the moan'. {hero} demonstrates. It's too good.","RESOLUTION: the haunting goes off perfectly. Children scream. A {rfoe} faints. {arca} is promoted to 'Senior Spook'. {hero} is given a candy corn. It's a bit stale, and a bit haunted."]},
{n:"The Feast That Ate Everything",cast:{arca:"{npcn}",arcb:"{food}"},memo:"the Great Feast",b:["{arca} invites {hero} to a feast in {rname}. The table is a mile long. The main dish is {arcb}, then {arcb}, and then, 'a surprise' (also {arcb}).","The feast turns competitive. A {rfoe} eats a whole turkey, then a small goat, then, regrettably, a hat. {hero} holds his own, then stops. He is full. He is also proud.","RESOLUTION: {hero} falls asleep in a pile of cushions, with a plate on his chest, and a smile. {comp} covers him with a tablecloth. It's the most peaceful moment of the month."]},
{n:"The Winter Festival",cast:{arca:"{npcn}",arcb:"{thing}"},memo:"the Winter Festival",b:["The Winter Festival comes to {rname}, with lights, songs and an overlarge, tilted tree. {hero} is chosen to light it. It is a great honor and a major fire hazard.","{arca} gives {hero} a gift: a very small {arcb}, wrapped badly. {hero} gives {arca} a very large {arcb}, wrapped worse. They both pretend to love it. They both do.","RESOLUTION: the tree is lit, the songs are sung, and a very quiet snow begins to fall. {hero} stands at the edge of the square, warm. {comp} brings cocoa. It's the best night of the year."]}
];
/* ---- extra global side quests (4 beats) ---- */
const XARCS=[
{n:"The Annoyed Wizard",cast:{arca:"{npcn}"},memo:"the Annoyed Wizard",b:["A wizard named {arca} corners {hero} in {rname} and says 'I have a complaint'. It's about a fireball. {hero} did not throw it. {arca} says that's what makes it a complaint.","{arca} shows {hero} a scorched hat, a singed beard, and three very upset birds. The fireball came from a {rfoe}. {hero} says that's not his problem. The birds disagree.","{hero} tracks down the {rfoe}, who admits it was a spell gone wrong. It was meant to be a very small light. {hero} says 'that's a very large light'.","RESOLUTION: the wizard is calmed, the birds are fed, and the {rfoe} gets a gift basket. {hero} is thanked in writing. The letter is a bit singed."]},
{n:"The Haunted Inn",cast:{arca:"{npcn}"},memo:"the Haunted Inn",b:["{hero} checks in to an inn in {rname}. The innkeeper, {arca}, says 'we have one room, and it's haunted'. {hero} says that's fine. {arca} says 'it is not fine'.","At midnight, the ghost appears, politely, with a tray. It asks if {hero} would like a pillow. {hero} asks why it's so nice. The ghost says it's 'trying to retire'.","The ghost's final request: be a decent guest, and review the inn honestly. {hero} gives it four stars. The ghost weeps. {arca} weeps. A {rfoe} in the next room also weeps.","RESOLUTION: the ghost is, at last, free to leave. The inn's reviews skyrocket. {arca} names a room after {hero}. It's haunted. It's perfect."]},
{n:"The Dragon's Therapist",cast:{arca:"{npcn}"},memo:"the Dragon's Therapist",b:["A very small sign in {rname} reads 'DRAGON THERAPY, WALK-INS WELCOME'. {hero} walks in. {arca} the dragon looks up, tired, and says, 'oh. A client.'","{arca} is a dragon who has been in therapy for years. {hero} is asked to sit in for a session as a 'peer'. The session is mostly {hero} nodding. It is a success.","The dragon's issue: people only visit to steal their gold. {hero} says that's awful. {arca} says 'you're pretty good at this'. {hero} says he's mostly just a coward.","RESOLUTION: the dragon graduates therapy and gives {hero} a coin, a hug and a very warm handshake. {hero} has never felt so wanted, or so singed."]},
{n:"The Bridge Troll Tax",cast:{arca:"{npcn}"},memo:"the Bridge Troll Tax",b:["A troll named {arca} blocks a bridge in {rname} and demands a toll. {hero} offers coins. The troll says 'no, a riddle'. {hero} says 'I'm not great at riddles'.","The riddle: 'what has a head and a tail but no body?' {hero} says 'a coin'. {arca} says 'correct'. {hero} says 'ah'. {arca} is thrilled. He has never lost.","The troll asks for another. {hero} says 'no, my turn'. {hero} asks 'what is the troll's biggest regret?' {arca} goes quiet. A {rfoe} wipes a tear.","RESOLUTION: the troll lets {hero} pass for free, and gives him a small gift: a stone. It is, as far as anyone can tell, a regular stone. {hero} keeps it. It's the nicest rock he has ever owned."]},
{n:"The Barista Of Doom",cast:{arca:"{npcn}"},memo:"the Barista Of Doom",b:["A cart in {rname} sells drinks to adventurers, run by {arca}, who has a menu longer than a scroll. The names are all questionable. {hero} orders 'the usual'. {arca} says 'we have no usual'.","The drink arrives: it's hot, it's green, it's glowing. {hero} sips. It tastes like victory, and a bit like feet. {comp} wants one. {comp} is warned. {comp} has one.","{arca} reveals a secret: the drinks are made with a bit of everything heroes leave behind: dreams, doubts, and a little bit of glitter. {hero} is moved. {hero} is full.","RESOLUTION: {hero} becomes a regular. {arca} gives him a loyalty card. Ten stamps, and the eleventh is a free sword. {hero} is at nine. He's very focused."]},
{n:"The Pigeon Post",cast:{arca:"{npcn}"},memo:"the Pigeon Post",b:["A pigeon lands on {hero}'s head in {rname} with a message. It's a very short message, and it's for someone else. {hero} must deliver it. The pigeon seems to know.","The message is for {arca}, three realms away. {hero} walks, runs, crawls and, once, is carried by a very kind {rfoe}. The pigeon rides on his shoulder, giving directions in coos.","{hero} arrives, out of breath, and hands over the note. {arca} reads it, laughs, cries and falls over. It was just 'hi'. It was from a friend. It was very much worth it.","RESOLUTION: the pigeon is promoted to Chief Messenger, with a tiny hat. It nods. {hero} nods back. They have a quiet, mutual respect."]},
{n:"The Very Small Dungeon",cast:{arca:"{npcn}"},memo:"the Very Small Dungeon",b:["A sign in {rname}: 'DUNGEON, ENTRANCE AT THE BACK'. {hero} goes round the back. It's a door the size of a mouse hole. {arca}, the proprietor, says 'duck'.","Inside, the dungeon is tiny: a one-step corridor, a three-inch pit, and a boss the size of a thumb. It is furious. It is also delightful. {comp} wants to adopt it.","{hero} defeats the boss with a stern look. The boss weeps. The pit is closed for repairs. {arca} hands over the treasure: a tiny chest with a tiny coin. It's valuable, in a certain light.","RESOLUTION: the dungeon is five-starred. {arca} names a room for {hero}. It's a closet. It's the finest closet in the realm."]},
{n:"The Rumor Mill",cast:{arca:"{npcn}"},memo:"the Rumor Mill",b:["A rumor is going around {rname}: {hero} once defeated a dragon with a spoon. {hero} did not. {comp} did not either. The rumor has legs. And a spoon.","The rumor grows. Now the dragon had three heads. Now the spoon was golden. Now {hero} has a spoon-themed cult. {arca} runs it. {hero} is the, regrettably, saint.","{hero} tries to kill the rumor, with the truth. It makes things worse. A bard writes a ballad about the truth, which is more embarrassing than the lie.","RESOLUTION: {hero} gives up, and simply carries a spoon. The rumor, satisfied, dies a quiet death. {hero} keeps the spoon. It's now, somehow, magic."]},
{n:"The Reluctant Dragon Rider",cast:{arca:"{npcn}"},memo:"the Reluctant Dragon Rider",b:["{arca} offers {hero} a ride on a dragon in {rname}. {hero} says no. {arca} says it's free. {hero} says it's still no. The dragon sighs, loudly, and kneels anyway.","{hero} climbs on, shaking. The dragon takes off. {hero} screams, in a very controlled way. {comp} is left behind, waving, looking small and betrayed.","The dragon takes {hero} on a loop over {rname}. The view is stunning. {hero} stops screaming. He is, for a moment, truly happy. Then the dragon sneezes.","RESOLUTION: {hero} lands, wobbly and exhilarated. The dragon says 'again?' {hero} says 'never'. They both know that's a lie. {hero} tips the dragon. It's a very small coin."]},
{n:"The Lost Sock",cast:{arca:"{npcn}"},memo:"the Lost Sock",b:["{hero} finds a single sock on the road in {rname}. It's enormous. It's also, apparently, the property of a giant. {arca} gives him directions. They are mostly pointing.","{hero} climbs a very tall mountain and finds the giant, looking sad, with one bare foot. The giant says 'my sock'. {hero} hands it over. The giant says 'my other sock'.","The other sock is in the nearest town, being used as a cottage. A family lives there. They love it. {hero} must negotiate. He is bad at it. {comp} is worse.","RESOLUTION: the giant lets the family keep the sock, and gets a very large pair of mittens as compensation. {hero} is thanked by both parties. It's the best day of his career."]},
{n:"The Haunted Wardrobe",cast:{arca:"{npcn}"},memo:"the Haunted Wardrobe",b:["A wardrobe in {rname} keeps whispering at night. {arca} asks {hero} to deal with it. {hero} opens it. Inside is a different, larger wardrobe, with a very small sign: 'NO'.","{hero} opens the inner wardrobe. Another. Another. It's wardrobes all the way down, each one grumpier. At the bottom, a tired voice says, 'finally, a customer'.","The voice belongs to a tailor ghost, trapped in a loop of fittings for a client who never came. {hero} offers to be the client. The tailor weeps with joy. The suit is dreadful.","RESOLUTION: {hero} wears the suit once, to be polite. The tailor ghost is freed. The wardrobe is just a wardrobe now, with a single sock in it, and a small note: 'thank you'."]}
];
